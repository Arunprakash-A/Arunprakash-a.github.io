<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAct coefficients</title>
<!--
  Interactive view of Eq. (3) with omega = 1 and K = 2: the five FAct coefficients as sliders.
  Hand-written, NOT generated by build_submission_figures.py (it has no source in
  blog/interactive-figures-src/). Edit this file directly. Fully self-contained by design:
  no <link>, no <script src>, no web fonts -- see rule 9 in the bundle's CLAUDE.md.
-->
<style>
  :root {
    --bg: #F4F6F9; --surface: #FFFFFF; --ink: #1A2129; --ink-muted: #5C6773; --ink-faint: #8996A3;
    --border: #DEE3E9; --border-soft: #E9ECF1; --grid: #EEF1F4;
    --s-fact: #2a78d6; --s-gelu: #eb6834; --s-pau: #1baf7a; --s-other: #7C8894;
    --shadow: 0 1px 2px rgba(23,35,52,0.06), 0 8px 24px -12px rgba(23,35,52,0.18);
    --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
               -webkit-font-smoothing: antialiased; }
  .wrap { padding: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
          box-shadow: var(--shadow); padding: 14px 16px 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .lab { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
         color: var(--ink-faint); }
  .seg { display: inline-flex; background: #ECF0F4; border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .seg button { font: 500 13px var(--font); color: var(--ink-muted); background: transparent; border: 0;
                border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink);
                                     box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  .seg button:focus-visible, input:focus-visible { outline: 2px solid var(--s-fact); outline-offset: 1px; }
  .toggle { font-size: 13px; color: var(--ink-muted); display: inline-flex; gap: 6px; align-items: center;
            cursor: pointer; }
  svg { display: block; width: 100%; margin-top: 10px; }
  svg text { font-family: var(--font); fill: var(--ink-muted); font-size: 11px; }
  .sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 6px 18px;
             margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--border-soft); }
  .sl { display: grid; grid-template-columns: 26px 1fr 74px; align-items: center; gap: 8px; }
  .sl label { font: italic 15px 'Times New Roman', Times, serif; color: var(--ink); }
  .sl label sub { font-size: 11px; font-style: normal; }
  .sl input[type=range] { width: 100%; accent-color: var(--s-fact); margin: 0; }
  .sl input[type=number] { width: 74px; font: 12px var(--mono); color: var(--ink); padding: 3px 4px;
                           border: 1px solid var(--border); border-radius: 6px; text-align: right; }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px; margin-top: 8px;
          font-size: 12px; color: var(--ink-muted); }
  .foot b { font: 600 12px var(--mono); color: var(--ink); }
  .key { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; }
  .key span::before { content: ""; display: inline-block; width: 16px; height: 0; margin-right: 5px;
                      vertical-align: middle; border-top: 2.5px solid var(--c); }
  .key span.dash::before { border-top-style: dashed; border-top-width: 2px; }
  .key span.dot::before { border-top-style: dotted; border-top-width: 2px; }
  .key span.band::before { border-top: 0; height: 11px; background: rgba(42,120,214,0.10);
                           border: 1px solid rgba(42,120,214,0.35); border-radius: 2px; }
  .note { margin: 10px 0 0; font-size: 12px; line-height: 1.45; color: var(--ink-muted); }
  .note b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <div class="row">
    <span class="lab">Preset</span>
    <div class="seg" role="group" aria-label="Coefficient presets">
      <button type="button" data-preset="init" title="Fourier coefficients that initialize FAct to approximate GELU (Equation 7)">GELU initialization</button>
      <button type="button" data-preset="learned" title="Coefficients of the shared activation learned by the source ViT-d6 on ImageNet-1K, seed 1 — the checkpoint transferred in all experiments">Learned FAct (ViT-d6, ImageNet-1K)</button>
      <button type="button" data-preset="zero" title="Neutral all-zero starting point for exploring coefficients">All zero</button>
    </div>
    <label class="toggle"><input type="checkbox" id="harm"> Show Fourier components</label>
    <label class="toggle"><input type="checkbox" id="range"> Show source pre-activation range</label>
  </div>

  <svg id="plot" role="img" aria-label="FAct activation phi of z over one period, minus pi to pi"></svg>
  <noscript><p class="note">This figure is interactive and needs JavaScript. The underlying
    mathematics is given in full in the text: the Fourier parameterization (Equation 3), the coefficient
    vector (Equation 4), the output bound (Equation 5) and the GELU-based initialization (Equations 6–7),
    with the learned seed-1 coefficients reported in Section 4.1.</p></noscript>
  <p class="note"><b>FAct is periodic with period 2&#x3C0;</b>; it is drawn over one period here. GELU
    is shown as a non-periodic reference, so the two curves may diverge near &#xB1;&#x3C0; &mdash; this is
    inherent to a truncated Fourier series, not an approximation error.</p>

  <div class="sliders" id="sliders"></div>

  <div class="foot">
    <div class="key" id="key">
      <span style="--c: var(--s-fact)">FAct &#x3D5;(z)</span>
      <span class="dash" style="--c: #B4BCC5">GELU (reference)</span>
      <span class="dot" style="--c: var(--s-gelu)">&#xB1;bound, Eq. (5)</span>
    </div>
    <div>bound <b id="bound"></b></div>
  </div>
</div>
</div>

<script>
(function () {
  /* Eq. (3) with omega = 1 and K = 2. Presets are the values reported in the paper:
     the GELU initialization (Eq. 6) and the coefficients learned on ImageNet-1K. */
  var PRESETS = {
    init:    { a0: 0.7061, a1: -0.7049, a2: 0.0261, b1: 1.0000, b2: -0.5000 },
    learned: { a0: 0.2182, a1:  0.1193, a2: -0.4237, b1: 0.8315, b2: -0.5918 },
    zero:    { a0: 0,      a1: 0,       a2: 0,       b1: 0,      b2: 0 }
  };
  var NAMES = [["a0", "a", "0"], ["a1", "a", "1"], ["a2", "a", "2"], ["b1", "b", "1"], ["b2", "b", "2"]];
  var LO = -1.5, HI = 1.5, STEP = 0.001;
  var PREZ0 = -1.02, PREZ1 = 1.04;   /* central 98% of source pre-activations (Figure 2) */
  var X0 = -Math.PI, X1 = Math.PI, Y0 = -3.5, Y1 = 3.5;
  var c = Object.assign({}, PRESETS.init);
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("plot");

  function phi(z) {
    return c.a0 + c.a1 * Math.cos(z) + c.b1 * Math.sin(z) + c.a2 * Math.cos(2 * z) + c.b2 * Math.sin(2 * z);
  }
  function gelu(z) {  /* tanh approximation; visually identical to the exact form at this scale */
    return 0.5 * z * (1 + Math.tanh(Math.sqrt(2 / Math.PI) * (z + 0.044715 * z * z * z)));
  }
  function bound() {
    return Math.abs(c.a0) + Math.abs(c.a1) + Math.abs(c.a2) + Math.abs(c.b1) + Math.abs(c.b2);
  }

  /* ---- sliders ---- */
  var box = document.getElementById("sliders"), inputs = {};
  NAMES.forEach(function (n) {
    var row = document.createElement("div"); row.className = "sl";
    var id = "c-" + n[0];
    row.innerHTML = '<label for="' + id + '">' + n[1] + '<sub>' + n[2] + '</sub></label>' +
      '<input type="range" id="' + id + '" min="' + LO + '" max="' + HI + '" step="' + STEP + '">' +
      '<input type="number" min="' + LO + '" max="' + HI + '" step="0.0001" aria-label="' + n[1] + n[2] + ' value">';
    var r = row.children[1], num = row.children[2];
    r.addEventListener("input", function () { set(n[0], +r.value); });
    num.addEventListener("change", function () {
      var v = parseFloat(num.value);
      set(n[0], isFinite(v) ? Math.max(LO, Math.min(HI, v)) : c[n[0]]);
    });
    inputs[n[0]] = [r, num];
    box.appendChild(row);
  });
  function set(k, v) { c[k] = v; sync(); }
  function sync() {
    NAMES.forEach(function (n) {
      inputs[n[0]][0].value = c[n[0]];
      inputs[n[0]][1].value = c[n[0]].toFixed(4);
    });
    document.querySelectorAll("[data-preset]").forEach(function (b) {
      var p = PRESETS[b.dataset.preset];
      var on = NAMES.every(function (n) { return Math.abs(p[n[0]] - c[n[0]]) < 5e-4; });
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    document.getElementById("bound").textContent = "|ϕ| ≤ " + bound().toFixed(2);
    draw();
  }
  document.querySelectorAll("[data-preset]").forEach(function (b) {
    b.addEventListener("click", function () { c = Object.assign({}, PRESETS[b.dataset.preset]); sync(); });
  });
  document.getElementById("harm").addEventListener("change", draw);
  document.getElementById("range").addEventListener("change", draw);

  /* ---- plot ---- */
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var a in attrs) e.setAttribute(a, attrs[a]);
    (parent || svg).appendChild(e); return e;
  }
  function draw() {
    var W = svg.clientWidth || 600, H = Math.round(Math.max(200, Math.min(320, W * 0.48)));
    var m = { l: 34, r: 10, t: 8, b: 30 };
    svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.style.height = H + "px";
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var sx = function (x) { return m.l + (x - X0) / (X1 - X0) * (W - m.l - m.r); };
    var sy = function (y) { return m.t + (Y1 - y) / (Y1 - Y0) * (H - m.t - m.b); };

    var defs = el("defs", {});
    var cp = el("clipPath", { id: "clip" }, defs);
    el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b }, cp);

    if (document.getElementById("range").checked) {
      el("rect", { x: sx(PREZ0), y: m.t, width: sx(PREZ1) - sx(PREZ0), height: H - m.t - m.b,
                   fill: "var(--s-fact)", "fill-opacity": 0.09 });
    }

    for (var y = -3; y <= 3; y++) {
      el("line", { x1: m.l, x2: W - m.r, y1: sy(y), y2: sy(y), stroke: y === 0 ? "#B4BCC5" : "var(--grid)", "stroke-width": 1 });
      var t = el("text", { x: m.l - 6, y: sy(y) + 4, "text-anchor": "end" }); t.textContent = y < 0 ? "−" + (-y) : y;
    }
    [[-Math.PI, "−π"], [-Math.PI / 2, "−π/2"], [0, "0"], [Math.PI / 2, "π/2"], [Math.PI, "π"]].forEach(function (tk) {
      el("line", { x1: sx(tk[0]), x2: sx(tk[0]), y1: m.t, y2: H - m.b, stroke: tk[0] === 0 ? "#B4BCC5" : "var(--grid)", "stroke-width": 1 });
      var t = el("text", { x: sx(tk[0]), y: H - m.b + 16, "text-anchor": tk[0] === X0 ? "start" : tk[0] === X1 ? "end" : "middle" });
      t.textContent = tk[1];
    });
    var xl = el("text", { x: W - m.r, y: H - 2, "text-anchor": "end", "font-style": "italic" }); xl.textContent = "pre-activation z";

    var g = el("g", { "clip-path": "url(#clip)" });
    function path(f, attrs) {
      var d = "", n = Math.max(120, Math.round(W / 2));
      for (var i = 0; i <= n; i++) {
        var x = X0 + (X1 - X0) * i / n;
        d += (i ? "L" : "M") + sx(x).toFixed(1) + "," + sy(f(x)).toFixed(1);
      }
      attrs.d = d; attrs.fill = "none"; return el("path", attrs, g);
    }
    var B = bound();
    [B, -B].forEach(function (b) {
      el("line", { x1: m.l, x2: W - m.r, y1: sy(b), y2: sy(b), stroke: "var(--s-gelu)", "stroke-width": 1.5, "stroke-dasharray": "2 4", "stroke-linecap": "round" }, g);
    });
    path(gelu, { stroke: "#B4BCC5", "stroke-width": 2, "stroke-dasharray": "6 4" });
    if (document.getElementById("harm").checked) {
      path(function () { return c.a0; }, { stroke: "var(--s-other)", "stroke-width": 1.25, opacity: 0.8 });
      path(function (z) { return c.a1 * Math.cos(z) + c.b1 * Math.sin(z); }, { stroke: "var(--s-pau)", "stroke-width": 1.5 });
      path(function (z) { return c.a2 * Math.cos(2 * z) + c.b2 * Math.sin(2 * z); }, { stroke: "#8b5cf6", "stroke-width": 1.5 });
    }
    path(phi, { stroke: "var(--s-fact)", "stroke-width": 3, "stroke-linejoin": "round" });
    updateKey();
  }
  function updateKey() {
    var key = document.getElementById("key");
    key.querySelectorAll(".h").forEach(function (s) { s.remove(); });
    if (document.getElementById("harm").checked) {
      [["var(--s-other)", "constant (a₀)"], ["var(--s-pau)", "first harmonic"], ["#8b5cf6", "second harmonic"]].forEach(function (h) {
        var s = document.createElement("span"); s.className = "h"; s.style.setProperty("--c", h[0]); s.textContent = h[1]; key.appendChild(s);
      });
    }
    if (document.getElementById("range").checked) {
      var s = document.createElement("span"); s.className = "h band"; s.textContent = "source pre-activation range"; key.appendChild(s);
    }
  }
  window.addEventListener("resize", draw);
  sync();
})();
</script>
<script>
/* Report our rendered height so the embedding figure can size its iframe
   (same handshake as the generated fig-*.html pages). */
(function () {
  var last = 0;
  function report() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h && h !== last) {
      last = h;
      parent.postMessage({ tmlrFigHeight: h, tmlrFigId: "fourier-coefficients" }, "*");
    }
  }
  window.addEventListener("load", report);
  window.addEventListener("resize", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  setTimeout(report, 120);
  setTimeout(report, 600);
})();
</script>
</body>
</html>
