<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Place-Value Workbench</title>
    
    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            /* Palette */
            --bg-deep: #0b0e16;
            --bg-vignette: radial-gradient(circle at center, #1a1d29 0%, #0b0e16 80%);
            
            --accent-cyan: #38bdf8;   /* Number A */
            --accent-pink: #f472b6;   /* Number B */
            --accent-violet: #a78bfa; /* Highlight/Action */
            --accent-amber: #fbbf24;  /* Warning/Error */
            
            --surface: rgba(30, 41, 59, 0.6);
            --surface-border: rgba(255, 255, 255, 0.08);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            /* Typography */
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace;

            /* Spacing & Radius */
            --radius-lg: 16px;
            --radius-md: 8px;
            --gap: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            background-color: var(--bg-deep);
            background-image: var(--bg-vignette);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden; /* App-like feel */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Layout Container */
        .app-container {
            width: 100%;
            max-width: 900px;
            height: 95vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: var(--gap);
            padding: 24px;
        }

        /* Header */
        header {
            text-align: center;
            padding-bottom: 10px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Stage (Visual Blocks) */
        .stage-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            position: relative;
            background: rgba(15, 23, 42, 0.4);
            border-radius: var(--radius-lg);
            border: 1px solid var(--surface-border);
            padding: 20px;
            overflow: hidden;
        }

        .operand-stage {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .stage-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .blocks-area {
            flex-grow: 1;
            position: relative;
            border-radius: var(--radius-md);
            background: rgba(0,0,0,0.2);
            /* Grid for alignment */
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .column-label {
            position: absolute;
            top: -25px;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            width: 100%;
        }

        /* The Blocks */
        .block {
            position: absolute;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 2;
        }

        /* Tens Rod (Vertical) */
        .rod {
            width: 16px;
            height: 80px;
            background: linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.3));
            border-radius: 4px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.3);
            position: relative;
        }
        /* Segments for Rod */
        .rod::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 7px,
                rgba(0,0,0,0.3) 7px,
                rgba(0,0,0,0.3) 8px
            );
            border-radius: 4px;
        }

        /* Ones Cube */
        .cube {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
            border-radius: 3px;
            box-shadow: 1px 1px 4px rgba(0,0,0,0.3);
        }

        /* Colors */
        .color-a .rod, .color-a .cube { background-color: var(--accent-cyan); }
        .color-a .rod::after { content: none; border: 1px solid rgba(255,255,255,0.3); } /* Solid look for A */
        
        .color-b .rod, .color-b .cube { background-color: var(--accent-pink); }
        .color-b .rod::after { content: none; border: 1px solid rgba(255,255,255,0.3); } /* Solid look for B */

        /* Operator Overlay (Center) */
        .operator-overlay {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--text-primary);
            z-index: 10;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        /* Column View (Arithmetic) */
        .column-view {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border);
        }

        .col-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 80px;
        }

        .digit-display {
            font-family: var(--font-mono);
            font-size: 2.5rem;
            line-height: 1;
            color: var(--text-primary);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .digit-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Carried/Borrowed Digits */
        .carry-digit {
            position: absolute;
            top: -25px;
            font-family: var(--font-mono);
            font-size: 1.2rem;
            color: var(--accent-violet);
            opacity: 0; /* Hidden by default */
            transform: scale(0.5);
        }

        .operator-symbol {
            align-self: center;
            font-size: 1.8rem;
            color: var(--text-secondary);
            margin-bottom: 40px; /* Align with top row */
        }

        .result-line {
            position: absolute;
            bottom: -5px;
            left: -20%;
            width: 140%;
            height: 2px;
            background: var(--text-secondary);
        }

        /* Controls */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 16px 24px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border);
        }

        .stepper-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stepper-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            width: 30px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .value-display {
            font-family: var(--font-mono);
            width: 35px;
            text-align: right;
            color: var(--text-primary);
        }

        /* Segmented Toggle */
        .toggle-group {
            display: flex;
            background: #0f172a;
            border-radius: var(--radius-md);
            padding: 3px;
            position: relative;
        }
        
        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 20px;
            font-size: 1rem;
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s;
        }

        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: calc(50% - 3px);
            height: calc(100% - 6px);
            background: var(--accent-violet);
            border-radius: 6px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        /* Action Buttons */
        .action-group {
            display: flex;
            gap: 10px;
        }

        button.action-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.action-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--text-secondary);
        }

        button.primary-action {
            background: var(--accent-violet);
            color: #fff;
            border: none;
            font-weight: 600;
        }
        button.primary-action:hover {
            background: #9368f5;
            box-shadow: 0 4px 12px rgba(167, 139, 250, 0.3);
        }

        /* Feedback Toast */
        .feedback-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container { height: auto; min-height: 100vh; overflow-y: auto; padding: 12px; gap: 15px; }
            body { overflow-y: auto; align-items: flex-start; background: var(--bg-deep); }
            .stage-container { grid-template-columns: 1fr; height: 300px; }
            .operator-overlay { font-size: 2rem; }
            .controls-bar { flex-wrap: wrap; justify-content: center; }
        }

    </style>
</head>
<body>

<div class="app-container">
    
    <header>
        <h1>Place-Value Workbench</h1>
        <div class="subtitle">Visualize addition and subtraction with regrouping.</div>
    </header>

    <!-- Visual Stage -->
    <div class="stage-container" id="stageContainer">
        
        <!-- Number A (Top/Left) -->
        <div class="operand-stage color-a" id="stageA">
            <div class="stage-label">
                <span>Number A</span>
                <span id="valDisplayA">24</span>
            </div>
            <div class="blocks-area" id="areaA">
                <!-- Blocks injected via JS -->
            </div>
        </div>

        <!-- Operator Symbol -->
        <div class="operator-overlay" id="opSymbol">+</div>

        <!-- Number B (Bottom/Right) -->
        <div class="operand-stage color-b" id="stageB">
            <div class="stage-label">
                <span>Number B</span>
                <span id="valDisplayB">37</span>
            </div>
            <div class="blocks-area" id="areaB">
                <!-- Blocks injected via JS -->
            </div>
        </div>

        <!-- Feedback Toast -->
        <div class="feedback-toast" id="toast">Need to regroup!</div>
    </div>

    <!-- Column View (Arithmetic) -->
    <div class="column-view">
        
        <!-- Ones Column -->
        <div class="col-group">
            <div class="carry-digit" id="carryOnes"></div>
            <div class="digit-display" id="digitA_ones">4</div>
            <div class="digit-display" id="digitB_ones">7</div>
            <div class="result-line"></div>
            <div class="digit-display" id="digitRes_ones">1</div> <!-- Result placeholder -->
            <div class="digit-label">Ones</div>
        </div>

        <!-- Operator -->
        <div class="operator-symbol" id="colOpSymbol">+</div>

        <!-- Tens Column -->
        <div class="col-group">
            <div class="carry-digit" id="carryTens"></div>
            <div class="digit-display" id="digitA_tens">2</div>
            <div class="digit-display" id="digitB_tens">3</div>
            <div class="result-line"></div>
            <div class="digit-display" id="digitRes_tens">6</div> <!-- Result placeholder -->
            <div class="digit-label">Tens</div>
        </div>

    </div>

    <!-- Controls -->
    <div class="controls-bar">
        
        <div class="stepper-group">
            <span class="stepper-label" style="color:var(--accent-cyan)">A:</span>
            <input type="range" id="sliderA" min="0" max="99" value="24">
            <div class="value-display" id="dispA">24</div>
        </div>

        <div class="stepper-group">
            <span class="stepper-label" style="color:var(--accent-pink)">B:</span>
            <input type="range" id="sliderB" min="0" max="99" value="37">
            <div class="value-display" id="dispB">37</div>
        </div>

        <!-- Operation Toggle -->
        <div class="toggle-group" id="opToggle">
            <div class="toggle-slider"></div>
            <button class="toggle-btn active" data-op="+">+</button>
            <button class="toggle-btn" data-op="-">-</button>
        </div>

        <!-- Actions -->
        <div class="action-group">
            <button class="action-btn" id="btnReset">Reset</button>
            <button class="action-btn primary-action" id="btnStep">Next Step</button>
            <button class="action-btn" id="btnAuto">Auto Play</button>
        </div>

    </div>

</div>

<script>
/**
 * State Management & Logic
 */
const state = {
    a: 24,
    b: 37,
    op: '+', // '+' or '-'
    
    // Calculation State Machine
    step: 'idle', // idle, compare_ones, regrouping, calculate_tens, done
    
    // Temporary values for display during animation
    tempA: { tens: 2, ones: 4 },
    tempB: { tens: 3, ones: 7 },
    
    carry: null, // 'borrow' or 'carry' (null if none)
};

// DOM Elements
const els = {
    sliderA: document.getElementById('sliderA'),
    sliderB: document.getElementById('sliderB'),
    dispA: document.getElementById('dispA'),
    dispB: document.getElementById('dispB'),
    valDisplayA: document.getElementById('valDisplayA'),
    valDisplayB: document.getElementById('valDisplayB'),
    
    areaA: document.getElementById('areaA'),
    areaB: document.getElementById('areaB'),
    
    opSymbol: document.getElementById('opSymbol'),
    colOpSymbol: document.getElementById('colOpSymbol'),
    
    digitA_ones: document.getElementById('digitA_ones'),
    digitB_ones: document.getElementById('digitB_ones'),
    digitRes_ones: document.getElementById('digitRes_ones'),
    
    digitA_tens: document.getElementById('digitA_tens'),
    digitB_tens: document.getElementById('digitB_tens'),
    digitRes_tens: document.getElementById('digitRes_tens'),
    
    carryOnes: document.getElementById('carryOnes'),
    carryTens: document.getElementById('carryTens'),
    
    btnStep: document.getElementById('btnStep'),
    btnAuto: document.getElementById('btnAuto'),
    btnReset: document.getElementById('btnReset'),
    
    opToggle: document.querySelectorAll('.toggle-btn'),
    toggleSlider: document.querySelector('.toggle-slider'),
    
    toast: document.getElementById('toast')
};

/**
 * Initialization & Rendering
 */
function init() {
    renderBlocks();
    updateColumnView(false); // No animation on load
    
    // Event Listeners
    els.sliderA.addEventListener('input', (e) => handleInput(e.target.value));
    els.sliderB.addEventListener('input', (e) => handleInput(e.target.value));
    
    els.opToggle.forEach(btn => {
        btn.addEventListener('click', () => toggleOp(btn.dataset.op));
    });

    els.btnStep.addEventListener('click', step);
    els.btnAuto.addEventListener('click', autoPlay);
    els.btnReset.addEventListener('click', reset);
}

function handleInput(val) {
    // If we are in the middle of a calculation, resetting inputs might be confusing. 
    // Let's allow it but reset state to idle.
    if (state.step !== 'idle') {
        reset();
    }
    
    const v = parseInt(val);
    if (els.sliderA === document.activeElement) state.a = v;
    else state.b = v;
    
    updateDisplays();
    renderBlocks();
}

function toggleOp(op) {
    if (state.step !== 'idle') reset();
    state.op = op;
    
    // UI Update
    els.opToggle.forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-op="${op}"]`).classList.add('active');
    
    const isAdd = op === '+';
    els.toggleSlider.style.transform = `translateX(${isAdd ? 0 : '100%'})`;
    
    updateDisplays();
    renderBlocks();
    updateColumnView(false);
}

function reset() {
    state.step = 'idle';
    state.carry = null;
    state.a = parseInt(els.sliderA.value);
    state.b = parseInt(els.sliderB.value);
    
    // Reset temp values to current operands
    state.tempA = { tens: Math.floor(state.a / 10), ones: state.a % 10 };
    state.tempB = { tens: Math.floor(state.b / 10), ones: state.b % 10 };

    updateDisplays();
    renderBlocks();
    updateColumnView(false);
    
    // Clear carries visually
    gsap.to([els.carryOnes, els.carryTens], { opacity: 0, scale: 0.5 });
}

function updateDisplays() {
    els.dispA.textContent = state.a;
    els.dispB.textContent = state.b;
    els.valDisplayA.textContent = state.a;
    els.valDisplayB.textContent = state.b;
    
    const sym = state.op === '+' ? '+' : '-';
    els.opSymbol.textContent = sym;
    els.colOpSymbol.textContent = sym;
}

/**
 * Block Rendering (Canvas-like DOM manipulation)
 */
function renderBlocks() {
    // Clear areas
    els.areaA.innerHTML = '';
    els.areaB.innerHTML = '';
    
    drawOperand(els.areaA, state.tempA.tens, state.tempA.ones, 'color-a');
    drawOperand(els.areaB, state.tempB.tens, state.tempB.ones, 'color-b');
}

function drawOperand(container, tensCount, onesCount, colorClass) {
    // Layout: Tens on left (50%), Ones on right (50%)
    const tWidth = container.clientWidth / 2;
    
    // Render Tens Rods (Left side)
    for(let i=0; i<tensCount; i++) {
        const rod = document.createElement('div');
        rod.className = `block rod ${colorClass}`;
        // Position: staggered slightly to right
        rod.style.left = `${10 + (i * 22)}px`; 
        rod.style.bottom = '10px';
        container.appendChild(rod);
    }

    // Render Ones Cubes (Right side) - Grid layout
    const cols = 5;
    for(let i=0; i<onesCount; i++) {
        const cube = document.createElement('div');
        cube.className = `block cube ${colorClass}`;
        
        const row = Math.floor(i / cols);
        const col = i % cols;
        
        // Position relative to right half of container
        const startX = tWidth + 10; 
        const startY = container.clientHeight - 20; // Stack from bottom
        
        cube.style.left = `${startX + (col * 22)}px`;
        cube.style.bottom = `${10 + (row * 22)}px`;
        
        container.appendChild(cube);
    }
}

/**
 * Column View Logic
 */
function updateColumnView(animate = true) {
    // Update digits based on current state
    const aTens = Math.floor(state.a / 10);
    const aOnes = state.a % 10;
    const bTens = Math.floor(state.b / 10);
    const bOnes = state.b % 10;

    // Set values (using temp for display during steps)
    els.digitA_tens.textContent = state.tempA.tens;
    els.digitA_ones.textContent = state.tempA.ones;
    
    els.digitB_tens.textContent = state.tempB.tens;
    els.digitB_ones.textContent = state.tempB.ones;

    // Calculate Result (Standard Algorithm)
    let resOnes, resTens;
    
    if (state.op === '+') {
        const sumOnes = state.tempA.ones + state.tempB.ones;
        resOnes = sumOnes >= 10 ? sumOnes - 10 : sumOnes;
        
        let carryVal = 0;
        if (sumOnes >= 10) {
            // Logic handled in step, but for final display:
            resTens = state.tempA.tens + state.tempB.tens + 1;
            els.carryOnes.textContent = '1';
            gsap.to(els.carryOnes, { opacity: 1, scale: 1 });
        } else {
            resTens = state.tempA.tens + state.tempB.tens;
            gsap.to(els.carryOnes, { opacity: 0, scale: 0.5 });
        }
    } else {
        // Subtraction
        if (state.tempA.ones < state.tempB.ones) {
            // Borrowed logic applied in step
            resOnes = (state.tempA.ones + 10) - state.tempB.ones;
            els.carryTens.textContent = '1'; // Visual indicator of borrow
            gsap.to(els.carryTens, { opacity: 1, scale: 1 });
        } else {
            resOnes = state.tempA.ones - state.tempB.ones;
            gsap.to(els.carryTens, { opacity: 0, scale: 0.5 });
        }
        
        // If we borrowed, subtract 1 from A's tens
        let borrowVal = (state.tempA.ones < state.tempB.ones && state.step === 'done') ? 1 : 0;
        resTens = state.tempA.tens - state.tempB.tens - borrowVal;
    }

    els.digitRes_ones.textContent = resOnes;
    els.digitRes_tens.textContent = resTens;
}

/**
 * Step Logic (The Core Educational Engine)
 */
function step() {
    if (state.step === 'done') return;

    const aOnes = state.tempA.ones;
    const bOnes = state.tempB.ones;
    
    // 1. Check Ones Column Requirement
    let needsRegroup = false;
    
    if (state.op === '+') {
        if ((aOnes + bOnes) >= 10) needsRegroup = true;
    } else {
        if (aOnes < bOnes) needsRegroup = true;
    }

    // If we are in 'idle' and need regrouping, go to regroup step.
    // If we are in 'idle' and don't need it, skip straight to calc? 
    // Better UX: Always show the "Compare" phase first if not done.
    
    if (state.step === 'idle') {
        state.step = 'compare';
        
        // Highlight active column
        gsap.to(els.digitA_ones, { color: '#fbbf24', duration: 0.3 });
        gsap.to(els.digitB_ones, { color: '#fbbf24', duration: 0.3 });
        
        if (needsRegroup) {
            // Show toast hint
            showToast(state.op === '+' ? "Ones sum >= 10! Regroup needed." : "Top ones too small. Borrow needed.");
            
            setTimeout(() => {
                state.step = 'regrouping';
                performRegroup();
            }, 800);
        } else {
             // Wait for user to click next or auto proceed? 
             // Let's just wait for "Next Step" implicitly by staying in compare.
             // But to make it smooth, let's transition to calc after a brief pause if no regroup needed?
             // Actually, standard pedagogy: Compare -> Calculate.
        }
    } else if (state.step === 'compare') {
        // User clicked next while comparing
        state.step = 'calculate_tens';
        performCalculation();
    } else if (state.step === 'regrouping') {
        // Animation finished, move to calculation
        state.step = 'calculate_tens';
        performCalculation();
    }
}

function showToast(msg) {
    els.toast.textContent = msg;
    gsap.fromTo(els.toast, 
        { opacity: 0, scale: 0.8 }, 
        { opacity: 1, scale: 1, duration: 0.3, yoyo: true, repeat: 1, onComplete: () => gsap.set(els.toast, { opacity: 0 }) }
    );
}

function performRegroup() {
    // Visual Logic for Regrouping
    
    if (state.op === '+') {
        // ADDITION CARRY
        // 1. Identify 'ones' blocks in both A and B
        const cubesA = els.areaA.querySelectorAll('.cube');
        const cubesB = els.areaB.querySelectorAll('.cube');
        
        // We need to move all of them to a "merge zone" then back as a rod
        // Simplified: Move B's ones into A, combine 10 into a rod
        
        // Target positions (center of container roughly)
        const tWidth = els.areaA.clientWidth / 2;
        
        // Animate B cubes moving to A side
        gsap.to(cubesB, {
            left: (i, el) => 10 + (parseInt(el.style.left) * 0.5), // Move towards center/left
            bottom: '50%', 
            duration: 0.6,
            ease: "power2.inOut",
            stagger: 0.02,
            onComplete: () => {
                // Logic: Remove B cubes, Add a Rod to A
                els.areaB.innerHTML = ''; // Clear B ones
                
                // Add new rod to A Tens area
                const rodCount = state.tempA.tens;
                const newRod = document.createElement('div');
                newRod.className = `block rod color-a`;
                newRod.style.left = `${10 + (rodCount * 22)}px`;
                newRod.style.bottom = '10px';
                els.areaA.appendChild(newRod);
                
                // Animate Rod pop
                gsap.fromTo(newRod, { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(1.7)" });
                
                // Update State
                state.tempA.ones = (state.tempA.ones + state.tempB.ones) - 10;
                state.tempA.tens += 1;
                state.tempB.ones = 0;
                
                renderBlocks(); // Re-render clean state to lock positions
                
                // Show carry digit in column view
                els.carryOnes.textContent = '1';
                gsap.fromTo(els.carryOnes, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1 });
            }
        });

    } else {
        // SUBTRACTION BORROW
        // 1. Take a rod from A Tens
        const rodsA = els.areaA.querySelectorAll('.rod');
        
        if (rodsA.length > 0) {
            const targetRod = rodsA[rodsA.length - 1]; // Rightmost rod
            
            // Animate Rod moving to Ones area
            gsap.to(targetRod, {
                left: '50%', // Move to right side of A's container
                bottom: '50%',
                opacity: 0.5,
                duration: 0.4,
                onComplete: () => {
                    targetRod.remove(); // Remove rod
                    
                    // Add 10 cubes in ones area
                    for(let i=0; i<10; i++) {
                        const cube = document.createElement('div');
                        cube.className = `block cube color-a`;
                        
                        const row = Math.floor(i / 5);
                        const col = i % 5;
                        const tWidth = els.areaA.clientWidth / 2;
                        
                        cube.style.left = `${tWidth + 10 + (col * 22)}px`;
                        cube.style.bottom = `${10 + (row * 22)}px`;
                        cube.style.opacity = '0';
                        els.areaA.appendChild(cube);
                    }
                    
                    // Animate cubes appearing
                    gsap.fromTo(els.areaA.querySelectorAll('.cube'), 
                        { opacity: 0, scale: 0 }, 
                        { opacity: 1, scale: 1, duration: 0.4, stagger: 0.02, ease: "back.out" }
                    );
                    
                    // Update State
                    state.tempA.tens -= 1;
                    state.tempA.ones += 10;
                    
                    renderBlocks(); // Clean up positions
                    
                    // Show borrow digit
                    els.carryTens.textContent = '1';
                    gsap.fromTo(els.carryTens, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1 });
                }
            });
        }
    }
}

function performCalculation() {
    // Finalize numbers based on operation
    
    if (state.op === '+') {
        state.tempA.ones = (state.a + state.b) % 10; // Wait, logic check. 
        // Actually, we just need to display the result of A+B.
        const sum = state.a + state.b;
        state.tempA.tens = Math.floor(sum / 10);
        state.tempA.ones = sum % 10;
        state.tempB.tens = 0;
        state.tempB.ones = 0;
    } else {
        const diff = state.a - state.b;
        state.tempA.tens = Math.floor(diff / 10);
        state.tempA.ones = diff % 10;
        state.tempB.tens = 0;
        state.tempB.ones = 0;
    }

    renderBlocks();
    updateColumnView(true); // Animate digits
    
    state.step = 'done';
    
    // Celebration / Completion visual
    gsap.fromTo(".digit-display", 
        { scale: 1.2, color: '#a78bfa' }, 
        { scale: 1, color: '#f8fafc', duration: 0.3, stagger: 0.1 }
    );
}

/**
 * Auto Play Logic
 */
async function autoPlay() {
    if (state.step !== 'idle') return;
    
    // Disable buttons
    els.btnStep.disabled = true;
    els.sliderA.disabled = true;
    els.sliderB.disabled = true;

    const aOnes = state.a % 10;
    const bOnes = state.b % 10;
    let needsRegroup = false;

    if (state.op === '+') {
        if ((aOnes + bOnes) >= 10) needsRegroup = true;
    } else {
        if (aOnes < bOnes) needsRegroup = true;
    }

    // Step 1: Compare
    state.step = 'compare';
    
    if (needsRegroup) {
        showToast(state.op === '+' ? "Let's regroup!" : "We need to borrow!");
        await wait(800);
        
        state.step = 'regrouping';
        performRegroup(); // Triggers internal animation
        await wait(1200); // Wait for animation
        
        renderBlocks(); // Snap to clean state after anim
    }

    // Step 2: Calculate
    state.step = 'calculate_tens';
    performCalculation();
    
    await wait(500);
    
    // Re-enable
    els.btnStep.disabled = false;
    els.sliderA.disabled = false;
    els.sliderB.disabled = false;
}

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// Start
init();

</script>
