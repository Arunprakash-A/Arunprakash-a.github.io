<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forces: Pushes and Pulls Playground</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-vignette: #1e293b;
            --surface: rgba(30, 41, 59, 0.7);
            --accent-amber: #fbbf24;
            --accent-blue: #38bdf8;
            --accent-pink: #f472b6;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-soft: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, var(--bg-vignette) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Nunito', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Layout */
        #app {
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 16px;
            position: relative;
        }

        /* Header / Object Selector */
        header {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 16px;
            z-index: 10;
        }

        .obj-selector {
            background: var(--surface);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }

        .obj-selector.active {
            border-color: var(--accent-amber);
            background: rgba(251, 191, 36, 0.1);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        .obj-icon { font-size: 24px; }
        .obj-label { font-weight: 700; color: var(--text-dim); font-size: 14px; letter-spacing: 0.5px; text-transform: uppercase; }
        .active .obj-label { color: var(--accent-amber); }

        /* Stage */
        #stage-container {
            flex: 1;
            position: relative;
            background: rgba(15, 23, 42, 0.6);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
            overflow: hidden;
            margin-bottom: 16px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Controls */
        #controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn-main {
            height: 70px;
            border-radius: var(--radius-md);
            border: none;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: var(--shadow-soft);
        }

        .btn-main:active { transform: scale(0.96); }
        
        #btn-push { background: var(--accent-blue); color: #fff; }
        #btn-pull { background: var(--accent-pink); color: #fff; }
        
        /* Strength Picker */
        .strength-picker {
            grid-column: span 2;
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 8px;
            background: var(--surface);
            border-radius: var(--radius-md);
        }

        .strength-opt {
            width: 70px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-dim);
        }

        .strength-opt.active {
            background: rgba(251, 191, 36, 0.15);
            color: var(--accent-amber);
            border: 1px solid var(--accent-amber);
        }

        /* Reset */
        #btn-reset {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        #btn-reset:hover { color: var(--text-main); background: rgba(255,255,255,0.1); }

        /* Responsive */
        @media (max-width: 600px) {
            .obj-label { display: none; }
            #controls { grid-template-columns: 1fr; }
            .strength-picker { grid-column: span 1; flex-direction: row; justify-content: space-between; }
        }

    </style>
</head>
<body>

<div id="app">
    <!-- Object Selector -->
    <header>
        <div class="obj-selector active" data-type="cart">
            <span class="obj-icon">🛒</span>
            <span class="obj-label">Cart</span>
        </div>
        <div class="obj-selector" data-type="ball">
            <span class="obj-icon">⚽</span>
            <span class="obj-label">Ball</span>
        </div>
        <!-- FIX #4: Replaced kite emoji with a swing set icon -->
        <div class="obj-selector" data-type="swing">
            <span class="obj-icon">🎠</span>
            <span class="obj-label">Swing</span>
        </div>
    </header>

    <!-- Stage -->
    <div id="stage-container">
        <canvas id="sim-canvas"></canvas>
    </div>

    <!-- Controls -->
    <div id="controls">
        <button id="btn-push" class="btn-main">
            <span style="font-size: 24px;">🖐️</span> PUSH
        </button>
        <button id="btn-pull" class="btn-main">
            <span style="font-size: 24px;">🤝</span> PULL
        </button>

        <div class="strength-picker">
            <div class="strength-opt active" data-val="0.5">Soft</div>
            <div class="strength-opt" data-val="1.0">Med</div>
            <div class="strength-opt" data-val="2.0">Strong</div>
        </div>
    </div>

    <!-- Reset -->
    <button id="btn-reset" aria-label="Reset Position">
        ↺
    </button>
</div>

<script>
/**
 * Physics & Rendering Engine
 */

// --- Configuration ---
const CONFIG = {
    friction: 0.98,       // Velocity multiplier per frame (simulates floor friction)
    wallBounce: 0.6,      // Energy kept after hitting a wall
    maxSpeed: 25,         // Cap for visual sanity
    colors: {
        amber: '#fbbf24',
        blue: '#38bdf8',
        pink: '#f472b6',
        grid: 'rgba(255, 255, 255, 0.03)',
        trail: ['#fbbf24', '#38bdf8', '#f472b6']
    }
};

// --- State ---
const state = {
    objType: 'cart', // cart, ball, swing
    strength: 0.5,   // multiplier
    x: 0, y: 0,     // Position (center of object)
    vx: 0, vy: 0,    // Velocity
    width: 60, height: 40,
    isMoving: false,
    trail: [],       // Array of {x, y, opacity}
    sparkles: []     // Array of active particles
};

// --- DOM Elements ---
const canvas = document.getElementById('sim-canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('stage-container');

// --- Initialization ---
function resize() {
    const rect = container.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    
    // Reset position to center if first load or just resize
    state.x = rect.width / 2;
    state.y = rect.height / 2;
}

window.addEventListener('resize', () => {
    resize();
    // Keep object in bounds on resize
    const w = container.clientWidth;
    const h = container.clientHeight;
    state.x = Math.min(Math.max(state.x, 30), w - 30);
    state.y = Math.min(Math.max(state.y, 30), h - 30);
});

resize();

// --- Physics Loop ---
let prevWasMoving = false; // FIX #1: Renamed to prevent overwriting before use in collision logic

function updatePhysics() {
    // Apply Velocity
    state.x += state.vx;
    state.y += state.vy;

    const w = container.clientWidth;
    const h = container.clientHeight;
    const hw = state.width / 2;
    const hh = state.height / 2;

    let hitWall = false;

    // Wall Collisions (Bounce)
    if (state.x - hw < 0) {
        state.x = hw;
        state.vx *= -CONFIG.wallBounce;
        hitWall = true;
    } else if (state.x + hw > w) {
        state.x = w - hw;
        state.vx *= -CONFIG.wallBounce;
        hitWall = true;
    }

    // FIX #1: Added missing closing brace for the Y-axis wall collision block
    if (state.y - hh < 0) {
        state.y = hh;
        state.vy *= -CONFIG.wallBounce;
        hitWall = true;
    } else if (state.y + hh > h) {
        state.y = h - hh;
        state.vy *= -CONFIG.wallBounce;
        hitWall = true;
    }

    // Friction
    state.vx *= CONFIG.friction;
    state.vy *= CONFIG.friction;

    // Stop if very slow
    const prevVx = state.vx;
    const prevVy = state.vy;
    
    if (Math.abs(state.vx) < 0.05) state.vx = 0;
    if (Math.abs(state.vy) < 0.05) state.vy = 0;

    // FIX #1: Detect transition from moving to stopped using the preserved previous frame value
    prevWasMoving = Math.abs(prevVx) > 0.1 || Math.abs(prevVy) > 0.1;
    const isNowStopped = (state.vx === 0 && state.vy === 0);
    
    if (prevWasMoving && isNowStopped) {
        spawnSparkles(state.x, state.y, CONFIG.colors.amber, 12);
    }

    state.isMoving = Math.abs(state.vx) > 0 || Math.abs(state.vy) > 0;

    // Trail Logic
    if (state.isMoving && frameCount % 3 === 0) {
        state.trail.push({ x: state.x, y: state.y, life: 1.0 });
    }
    
    // Update Trail Life
    for (let i = state.trail.length - 1; i >= 0; i--) {
        state.trail[i].life -= 0.02;
        if (state.trail[i].life <= 0) state.trail.splice(i, 1);
    }

    // Sparkle Logic (on wall hit or stop)
    if (hitWall && Math.abs(state.vx) > 1 || Math.abs(state.vy) > 1) {
        spawnSparkles(state.x, state.y, CONFIG.colors.amber, 8);
    }
    
    frameCount++;
}

// --- Rendering ---
let frameCount = 0;
let idleOffset = 0;

function draw() {
    const w = container.clientWidth;
    const h = container.clientHeight;
    
    // Clear
    ctx.clearRect(0, 0, w, h);

    // Draw Grid (Perspective hint)
    drawGrid(w, h);

    // Draw Trail
    state.trail.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56, 189, 248, ${p.life * 0.5})`; // Blue trail
        ctx.fill();
    });

    // Draw Sparkles
    state.sparkles.forEach((s, i) => {
        s.x += s.vx;
        s.y += s.vy;
        s.life -= 0.03;
        
        if (s.life > 0) {
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.rotate(s.rot + frameCount * 0.1);
            ctx.fillStyle = `rgba(251, 191, 36, ${s.life})`;
            drawStar(ctx, 0, 0, 5, 8 * s.life, 4 * s.life);
            ctx.restore();
        } else {
            state.sparkles.splice(i, 1);
        }
    });

    // Draw Direction Arrow (Behind object)
    if (state.isMoving || Math.abs(state.vx) > 0.1 || Math.abs(state.vy) > 0.1) {
        drawArrow(w, h);
    }

    // Draw Object
    ctx.save();
    ctx.translate(state.x, state.y + idleOffset);
    
    // Idle Animation (gentle bounce)
    if (!state.isMoving) {
        idleOffset = Math.sin(frameCount * 0.05) * 3;
    } else {
        idleOffset = 0;
    }

    drawObject(ctx, state.objType);
    ctx.restore();

    requestAnimationFrame(loop);
}

function loop() {
    updatePhysics();
    draw();
}

// --- Drawing Helpers ---

function drawGrid(w, h) {
    ctx.strokeStyle = CONFIG.colors.grid;
    ctx.lineWidth = 1;
    const gridSize = 40;
    
    // Perspective effect: lines converge slightly towards center? 
    // Let's keep it simple flat grid for clarity for kids.
    ctx.beginPath();
    for (let x = 0; x <= w; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
    }
    for (let y = 0; y <= h; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
    }
    ctx.stroke();
}

function drawObject(ctx, type) {
    const w = state.width;
    const h = state.height;

    if (type === 'cart') {
        // Body
        ctx.fillStyle = CONFIG.colors.amber;
        roundRect(ctx, -w/2, -h/2, w, h, 8);
        ctx.fill();
        
        // Wheels
        ctx.fillStyle = '#1e293b';
        ctx.beginPath(); ctx.arc(-w/4, h/2, 6, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(w/4, h/2, 6, 0, Math.PI*2); ctx.fill();

        // Handle (indicates push direction)
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-w/2, -h/4);
        ctx.lineTo(-w/2 - 10, -h/2 - 5);
        ctx.stroke();

    } else if (type === 'ball') {
        // Ball
        const r = w / 2;
        const grad = ctx.createRadialGradient(-r/3, -r/3, r/4, 0, 0, r);
        grad.addColorStop(0, '#60a5fa');
        grad.addColorStop(1, '#2563eb');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        // Shine
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(-r/3, -r/3, r/4, 0, Math.PI * 2);
        ctx.fill();

    } else if (type === 'swing') {
        // Seat
        ctx.fillStyle = CONFIG.colors.pink;
        roundRect(ctx, -w/2, h/4, w, h/3, 5);
        
        // Chains
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-w/4, h/4);
        ctx.lineTo(-w/4, -h/2);
        ctx.moveTo(w/4, h/4);
        ctx.lineTo(w/4, -h/2);
        ctx.stroke();

        // Top bar
        ctx.fillStyle = '#94a3b8';
        roundRect(ctx, -w/2 - 5, -h/2 - 5, w + 10, 6, 3);
    }
}

function drawArrow(w, h) {
    // Calculate angle from velocity
    const angle = Math.atan2(state.vy, state.vx);
    
    ctx.save();
    ctx.translate(state.x, state.y);
    ctx.rotate(angle - Math.PI/2); // Adjust for canvas Y-up/Y-down
    
    // Arrow size based on speed magnitude
    const speed = Math.sqrt(state.vx**2 + state.vy**2);
    const len = 40 + (speed * 3); 
    const width = 15;

    ctx.rotate(Math.PI/2 - angle); // Reset rotation to draw relative to screen? No, keep rotated.
    
    // Draw Arrow pointing "Up" in local space (which is direction of motion)
    ctx.fillStyle = 'rgba(251, 191, 36, 0.4)';
    ctx.strokeStyle = CONFIG.colors.amber;
    ctx.lineWidth = 2;

    ctx.beginPath();
    // Tail
    ctx.moveTo(-width/2, -len/2);
    ctx.lineTo(width/2, -len/2);
    // Shaft
    ctx.lineTo(width/4, len/4);
    // Head
    ctx.lineTo(0, len/2);
    ctx.lineTo(-width/4, len/4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    let step = Math.PI / spikes;

    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
}

function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function spawnSparkles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        state.sparkles.push({
            x: x, 
            y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 1.0,
            rot: Math.random() * Math.PI
        });
    }
}

// --- Interaction Logic ---

function applyForce(direction) {
    // direction: 'push' (away/down/right), 'pull' (toward/up/left)
    
    const speed = state.strength * 10; // Base speed multiplier
    
    let angle;
    if (direction === 'push') {
        // FIX #2: Push is strictly downward (positive Y in canvas space)
        angle = Math.PI / 2; 
    } else {
        // FIX #2: Pull is strictly upward (negative Y in canvas space)
        angle = -Math.PI / 2;
    }

    state.vx += Math.cos(angle) * speed;
    state.vy += Math.sin(angle) * speed;

    // Visual feedback
    spawnSparkles(state.x, state.y, CONFIG.colors.blue, 5);
}

function resetObject() {
    const w = container.clientWidth / 2;
    const h = container.clientHeight / 2;
    
    // FIX #3: Direct assignment instead of gsap.set for immediate visual feedback
    state.x = w;
    state.y = h;
    state.vx = 0;
    state.vy = 0;
    
    // Clear trails on reset for cleanliness
    state.trail = [];
}

// Event Listeners
document.getElementById('btn-push').addEventListener('click', () => applyForce('push'));
document.getElementById('btn-pull').addEventListener('click', () => applyForce('pull'));
document.getElementById('btn-reset').addEventListener('click', resetObject);

// Object Selector
document.querySelectorAll('.obj-selector').forEach(el => {
    el.addEventListener('click', () => {
        document.querySelector('.obj-selector.active').classList.remove('active');
        el.classList.add('active');
        
        const type = el.dataset.type;
        state.objType = type;

        // Adjust dimensions based on object
        if (type === 'ball') { state.width = 50; state.height = 50; }
        else if (type === 'swing') { state.width = 60; state.height = 70; }
        else { state.width = 60; state.height = 40; }

        // Pop animation on selection
        gsap.from(el, { scale: 0.9, duration: 0.3, ease: "back.out" });
    });
});

// Strength Selector
document.querySelectorAll('.strength-opt').forEach(el => {
    el.addEventListener('click', () => {
        document.querySelector('.strength-opt.active').classList.remove('active');
        el.classList.add('active');
        state.strength = parseFloat(el.dataset.val);
    });
});

// FIX #1: Start Loop safely after DOM and resources are ready
window.addEventListener('DOMContentLoaded', () => {
    requestAnimationFrame(loop);
});

</script>
</body>
</html>
