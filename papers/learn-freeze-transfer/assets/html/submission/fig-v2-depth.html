:root {

    --ink-faint: #8996A3;
    --border: #DEE3E9;
    --border-soft: #E9ECF1;
    --accent: #B8690F;
    --accent-ink: #7A4508;
    --accent-soft: #F4E3CE;

    --s-fact: #2a78d6;
    --s-gelu: #eb6834;
    --s-pau:  #1baf7a;
    --s-other: #7C8894;

    --s-gelu-soft: rgba(235,104,52,0.14);
    --s-pau-soft:  rgba(27,175,122,0.14);
    /* sequential blue ramp, 100 -> 700 */
    --q0:#cde2fb; --q1:#9ec5f4; --q2:#6da7ec; --q3:#3987e5; --q4:#256abf; --q5:#184f95; --q6:#0d366b;
    --qt0:#12161C; --qt1:#12161C; --qt2:#12161C; --qt3:#12161C; --qt4:#FFFFFF; --qt5:#FFFFFF; --qt6:#FFFFFF;
    /* diverging poles */
    --pos: #2a78d6; --neg: #e34948; --mid: #f0efec;
    --shadow: 0 1px 2px rgba(23,35,52,0.06), 0 8px 24px -12px rgba(23,35,52,0.18);
    --font-display: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-display); -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 40px 16px 80px; }
  @media (min-width: 720px) { .wrap { padding: 40px 28px 88px; } }

  /* ---------- Header ---------- */
  header { display: flex; flex-direction: column; gap: 13px; margin-bottom: 26px; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--accent-ink); font-weight: 600;
  }
  h1 { font-size: clamp(25px, 3.4vw, 34px); font-weight: 700; margin: 0;
       letter-spacing: -0.015em; text-wrap: balance; }
  .dek { max-width: 66ch; color: var(--ink-muted); font-size: 15px; line-height: 1.55; margin: 0; }
  .dek code, code.k {
    font-family: var(--font-mono); background: var(--surface-2); padding: 1px 5px;
    border-radius: 4px; font-size: 0.92em; color: var(--ink);
  }
  .byline { font-size: 12.5px; color: var(--ink-faint); font-family: var(--font-mono); }
  .byline a { color: var(--accent-ink); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }


  /* ---------- Panels ---------- */
  section.panel { display: none; }
  section.panel.active { display: block; animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  h2 { font-size: 20px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  h2 .src { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500;
            color: var(--ink-faint); text-transform: uppercase; letter-spacing: .07em;
            display: block; margin-bottom: 5px; }
  .sub { color: var(--ink-muted); font-size: 14px; line-height: 1.55; margin: 0 0 18px; max-width: 74ch; }

  .card {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: 12px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 18px;
    min-width: 0;
  }
  .card > h3 { font-size: 13.5px; font-weight: 600; margin: 0 0 2px; }
  .card > .hint { font-size: 12px; color: var(--ink-faint); margin: 0 0 12px; }
  .grid2 { display: grid; gap: 18px; grid-template-columns: 1fr; }
  .grid2 > * { min-width: 0; }
  @media (min-width: 900px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .grid2.wide-left { grid-template-columns: 1fr; }
  @media (min-width: 980px) { .grid2.wide-left { grid-template-columns: 1.45fr 1fr; } }

  /* ---------- Controls ---------- */
  .ctlbar {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    padding: 11px 14px; background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: 10px; margin-bottom: 14px; font-size: 12.5px;
  }
  .ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: 100%; }
  .ctl > label.cap {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--ink-faint); font-weight: 600;
  }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--surface-2); border-radius: 8px; padding: 3px;
         border: 1px solid var(--border-soft); max-width: 100%; }
  .seg button {
    appearance: none; border: none; background: transparent; color: var(--ink-muted);
    font-family: var(--font-display); font-size: 12.5px; font-weight: 600;
    padding: 5px 11px; border-radius: 6px; cursor: pointer;
  }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .chip {
    appearance: none; cursor: pointer; font-family: var(--font-display);
    font-size: 12px; font-weight: 500; padding: 4px 10px 4px 8px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-faint);
    display: inline-flex; align-items: center; gap: 6px; transition: all .13s ease;
  }
  .chip .sw { width: 11px; height: 3px; border-radius: 2px; background: currentColor; flex: none; }
  .chip.on { color: var(--ink); border-color: var(--border); background: var(--surface-2); }
  .chip:not(.on) .sw { opacity: .35; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; height: 3px; border-radius: 2px;
    background: var(--border); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--s-fact); cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: var(--surface);
    border: 2px solid var(--s-fact); cursor: pointer;
  }
  .btn {
    appearance: none; cursor: pointer; font-family: var(--font-display); font-size: 12px;
    font-weight: 600; padding: 6px 12px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-muted);
  }
  .btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .btn.primary { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }

  /* sliders block */
  .sliders { display: grid; grid-template-columns: 1fr; gap: 9px; }
  .srow { display: grid; grid-template-columns: 46px 1fr 62px; align-items: center; gap: 10px; }
  .srow .nm { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); }
  .srow .vl { font-family: var(--font-mono); font-size: 12px; color: var(--ink);
              text-align: right; font-variant-numeric: tabular-nums; }

  /* ---------- Stat tiles ---------- */
  .tiles { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); margin-bottom: 18px; }
  .tile { min-width: 0; }
  @media (min-width: 760px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
  .tile { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 10px;
          padding: 12px 14px; box-shadow: var(--shadow); }
  .tile .lab { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em;

  .tile .note { font-size: 11.5px; color: var(--ink-muted); margin-top: 3px; }

  .chartbox { position: relative; width: 100%; min-width: 0; }
  .chartscroll { width: 100%; overflow-x: auto; overflow-y: hidden; }
  .chartscroll svg { display: block; width: 100%; height: auto; overflow: visible; }

  .chartscroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .axlab { fill: var(--ink-faint); font-size: 10.5px; font-family: var(--font-mono); }
  .axtitle { fill: var(--ink-muted); font-size: 11px; font-family: var(--font-display); font-weight: 600; }
  .dlabel { font-size: 10.5px; font-family: var(--font-display); font-weight: 600; }

  .ckey .sw-gelu { background: var(--s-gelu); }
  .ckey .sw-other { background: var(--s-other); }

    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; z-index: 20;
    min-width: 132px; color: var(--ink);

  .tip.show { opacity: 1; }
  .tip .th { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint);
             text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }

  .tip .tr .nm { display: flex; align-items: center; gap: 6px; color: var(--ink-muted); }
  .tip .tr .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .tip .tr .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }

  /* ---------- Data table ---------- */
  details.tbl { margin-top: 10px; }
  details.tbl summary {
    cursor: pointer; font-size: 12px; font-weight: 600; color: var(--ink-muted);
    font-family: var(--font-display); list-style: none; display: inline-flex; gap: 6px; align-items: center;

  details.tbl summary::-webkit-details-marker { display: none; }
  details.tbl summary::before { content: "▸"; color: var(--ink-faint); }
  details.tbl[open] summary::before { content: "▾"; }
  table.dt { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  table.dt th, table.dt td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--border-soft); }
  table.dt th:first-child, table.dt td:first-child { text-align: left; }
  table.dt th { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase;

  table.dt td { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-muted); }
  table.dt td:first-child { font-family: var(--font-display); color: var(--ink); font-weight: 500; }
  table.dt tr.hl td { color: var(--ink); font-weight: 600; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
            font-size: 12px; color: var(--ink-muted); margin-bottom: 10px; }
  .legend .it { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .legend .sw.dot { width: 9px; height: 9px; border-radius: 50%; }

  .footnote { font-size: 11.5px; color: var(--ink-faint); line-height: 1.55; margin-top: 10px; }
  .footnote code { font-family: var(--font-mono); }

  .themetog { position: fixed; right: 14px; bottom: 14px; z-index: 50; }
  .themetog button {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-muted); cursor: pointer; font-size: 15px;
    box-shadow: var(--shadow);
  }

/* ---------- embedded-in-paper overrides (TMLR Beyond PDF) ---------- */
html, body { margin: 0; padding: 0; background: var(--bg); }
.wrap { max-width: none; margin: 0; padding: 14px 14px 18px; }

section.panel { display: block; animation: none; }
section.panel:last-child .card:last-child { margin-bottom: 0; }
.card { margin-bottom: 14px; }

</style>

      d += (pen ? "L" : "M") + this.x(p[0]).toFixed(2) + " " + this.y(p[1]).toFixed(2) + " "; pen = true;
    }
    if (!d) return null;
    const el = E("path", { d, style: Object.assign({ fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" }, style) });
    (g || this.gPlot).appendChild(el); return el;
  }
  area(pts, style) {
    let up = "", dn = [];
    for (const p of pts) { if (p[1] === null) continue; up += (up ? "L" : "M") + this.x(p[0]).toFixed(2) + " " + this.y(p[1]).toFixed(2) + " "; dn.push([this.x(p[0]), this.y(p[2])]); }
    if (!up) return;
    for (let i = dn.length - 1; i >= 0; i--) up += "L" + dn[i][0].toFixed(2) + " " + dn[i][1].toFixed(2) + " ";
    this.gPlot.appendChild(E("path", { d: up + "Z", style: Object.assign({ stroke: "none" }, style) }));
  }
  dlabel(x, y, text, color, anchor) {
    const t = E("text", { class: "dlabel", x, y, "text-anchor": anchor || "start", style: { fill: color } });
    t.textContent = text; this.gFree.appendChild(t); return t;
  }
  /* tooltip */
  showTip(px, py, html) {
    this.tip.innerHTML = html; this.tip.classList.add("show");
    const hr = this.host.getBoundingClientRect(), sr = this.svg.getBoundingClientRect();
    const tw = this.tip.offsetWidth, th = this.tip.offsetHeight;
    const sx = sr.width / this.o.w, sy = sr.height / this.o.h;
    const ox = sr.left - hr.left, oy = sr.top - hr.top;
    let L = ox + px * sx + 14, T = oy + py * sy - th / 2;
    if (L + tw > hr.width - 4) L = ox + px * sx - tw - 14;
    this.tip.style.left = clamp(L, 2, Math.max(2, hr.width - tw - 2)) + "px";
    this.tip.style.top = clamp(T, 2, Math.max(2, hr.height - th - 2)) + "px";
  }
  hideTip() { this.tip.classList.remove("show"); }
  overlay(onMove, onLeave) {
    const r = E("rect", { x: this.o.m.l, y: this.o.m.t, width: this.iw, height: this.ih, style: { fill: "transparent", cursor: this.o.zoomX ? "grab" : "crosshair" } });
    this.gOver.textContent = ""; this.gOver.appendChild(r);
    const toUser = ev => {
      const b = this.svg.getBoundingClientRect();
      return [(ev.clientX - b.left) / b.width * this.o.w, (ev.clientY - b.top) / b.height * this.o.h];
    };
    r.addEventListener("pointermove", ev => { if (this._drag) return; const [ux, uy] = toUser(ev); onMove && onMove(ux, uy, ev); });
    r.addEventListener("pointerleave", () => { this.hideTip(); onLeave && onLeave(); });
    this._toUser = toUser;
    return r;
  }
  _wireZoom() {
    const self = this;
    this.svg.addEventListener("wheel", ev => {
      if (!self.o.zoomX && !self.o.zoomY) return;
      ev.preventDefault();
      const b = self.svg.getBoundingClientRect();
      const ux = (ev.clientX - b.left) / b.width * self.o.w, uy = (ev.clientY - b.top) / b.height * self.o.h;
      const f = Math.exp(ev.deltaY * 0.0016);
      if (self.o.zoomX) { const c = self.ix(ux); self.xd = [c - (c - self.xd[0]) * f, c + (self.xd[1] - c) * f]; self._limit("x"); }
      if (self.o.zoomY && (ev.shiftKey || !self.o.zoomX)) { const c = self.iy(uy); self.yd = [c - (c - self.yd[0]) * f, c + (self.yd[1] - c) * f]; self._limit("y"); }
      self.redraw && self.redraw();
    }, { passive: false });
    let sx = 0, sy = 0, x0 = null, y0 = null;
    this.svg.addEventListener("pointerdown", ev => {
      if (!self.o.zoomX && !self.o.zoomY) return;
      self._drag = true; sx = ev.clientX; sy = ev.clientY; x0 = self.xd.slice(); y0 = self.yd.slice();
      self.hideTip(); self.svg.setPointerCapture(ev.pointerId); self.svg.style.cursor = "grabbing";
    });
    this.svg.addEventListener("pointermove", ev => {
      if (!self._drag) return;
      const b = self.svg.getBoundingClientRect();
      const dx = (ev.clientX - sx) / b.width * self.o.w / self.iw * (x0[1] - x0[0]);
      const dy = (ev.clientY - sy) / b.height * self.o.h / self.ih * (y0[1] - y0[0]);
      if (self.o.zoomX) { self.xd = [x0[0] - dx, x0[1] - dx]; self._limit("x"); }
      if (self.o.zoomY) { self.yd = [y0[0] + dy, y0[1] + dy]; self._limit("y"); }
      self.redraw && self.redraw();
    });
    const end = ev => { if (!self._drag) return; self._drag = false; self.svg.style.cursor = ""; try { self.svg.releasePointerCapture(ev.pointerId); } catch (e) { } };
    this.svg.addEventListener("pointerup", end); this.svg.addEventListener("pointercancel", end);
    this.svg.addEventListener("dblclick", () => { self.reset(); });
  }
  _limit(ax) {
    const d0 = ax === "x" ? this.xd0 : this.yd0; if (!d0) return;
    const cur = ax === "x" ? this.xd : this.yd;
    const full = d0[1] - d0[0], span = cur[1] - cur[0];
    if (span > full * 3) { const c = (cur[0] + cur[1]) / 2; cur[0] = c - full * 1.5; cur[1] = c + full * 1.5; }
    if (span < full / 60) { const c = (cur[0] + cur[1]) / 2; cur[0] = c - full / 120; cur[1] = c + full / 120; }
  }
  reset() { if (this.xd0) this.xd = this.xd0.slice(); if (this.yd0) this.yd = this.yd0.slice(); this.redraw && this.redraw(); }
}

/* ---------------------------------------------------- small UI factories */
function seg(host, items, active, cb) {
  const el = typeof host === "string" ? $("#" + host) : host;
  el.innerHTML = "";
  items.forEach(it => {
    const b = H("button", it.k === active ? "on" : "", it.l);
    b.onclick = () => { $$("button", el).forEach(x => x.classList.remove("on")); b.classList.add("on"); cb(it.k); };
    el.appendChild(b);
  });
  return el;
}
function chips(host, items, isOn, cb) {
  const el = typeof host === "string" ? $("#" + host) : host;
  el.innerHTML = "";
  items.forEach(it => {
    const b = H("button", "chip" + (isOn(it.k) ? " on" : ""));
    const sw = H("span", "sw"); sw.style.background = it.c || col(it.k);
    if (it.dash) { sw.style.background = "none"; sw.style.borderTop = "3px dotted " + (it.c || col(it.k)); sw.style.height = "0"; }
    b.appendChild(sw); b.appendChild(document.createTextNode(it.l));
    b.onclick = () => { cb(it.k); b.classList.toggle("on", isOn(it.k)); };
    el.appendChild(b);
  });
  return el;
}
function legend(host, items) {
  const el = typeof host === "string" ? $("#" + host) : host;
  el.innerHTML = "";
  items.forEach(it => {
    const s = H("span", "it");
    const sw = H("span", "sw" + (it.dot ? " dot" : ""));
    sw.style.background = it.c;
    if (it.dash) { sw.style.background = "none"; sw.style.borderTop = "3px dashed " + it.c; sw.style.height = "0"; }
    s.appendChild(sw); s.appendChild(document.createTextNode(it.l)); el.appendChild(s);
  });
}
function tipRows(rows, head) {
  let h = head ? `<div class="th">${head}</div>` : "";
  rows.forEach(r => {
    h += `<div class="tr"><span class="nm">${r.c ? `<span class="sw" style="background:${r.c}"></span>` : ""}${r.l}</span><span class="v">${r.v}</span></div>`;
  });
  return h;
}
function table(host, cols, rows, hlIdx) {
  const el = typeof host === "string" ? $("#" + host) : host;
  let h = '<table class="dt"><thead><tr>' + cols.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>";
  rows.forEach((r, i) => { h += `<tr class="${hlIdx === i ? "hl" : ""}">` + r.map(c => `<td>${c}</td>`).join("") + "</tr>"; });
  el.innerHTML = h + "</tbody></table>";
}

/* constants shared by more than one v6 panel */
const PRESET = {
  gelu: D.gelu_k2_init,
  learned: { a0: D.pau_coeffs.fact_fixed.a0, a: D.pau_coeffs.fact_fixed.a.slice(), b: D.pau_coeffs.fact_fixed.b.slice() },
  zero: { a0: 0, a: [0, 0], b: [0, 0] }
};
const COEF_NM = ["a₀", "a₁", "a₂", "b₁", "b₂"];
const TR_ORDER = ["fact_fixed", "relu", "leaky_relu", "gelu", "silu", "mish", "hardswish", "softplus", "elu", "selu", "tanh"];
const ARCH = { vit: "ViT-d2", swin: "Swin-d2", linvit: "LinViT-d2", mixer: "MLP-Mixer" };
const ARCHK = ["vit", "swin", "linvit", "mixer"];
/* Swin depth-sweep arms (version-2 depth explorer) */
const DEPTH_ARMS = ["gelu", "fact_k2_global_frozen", "fact_fixed"];
const DEPTH_LAB = { gelu: "GELU", fact_k2_global_frozen: "Frozen GELU-init", fact_fixed: "Frozen FAct" };

</script>
<script>
/* ==================================================================== */
/*  Depth sensitivity (Swin) — version-2                                 */
/*  D.depth_swin[ds][arm][depth] = {n, mean, sd, test}                   */
/* ==================================================================== */
const dpState = { ds: "food101", view: "acc" };
const DEPTH_STYLE = {
  gelu:                  { c: "var(--s-gelu)", dash: "6 3", w: 2.0, mark: "circle" },
  fact_k2_global_frozen: { c: "var(--s-pau)",  dash: "2 3", w: 2.0, mark: "square" },
  fact_fixed:            { c: "var(--s-fact)", dash: null,  w: 2.6, mark: "diamond" }
};
function dpMarker(p, cx, cy, kind, fill) {
  const s = 3.6;
  if (kind === "square") return E("rect", { x: cx - s, y: cy - s, width: 2 * s, height: 2 * s, style: { fill, stroke: "var(--surface)", "stroke-width": 1.4 } });
  if (kind === "diamond") return E("path", { d: `M${cx} ${cy - s - 0.7} L${cx + s + 0.7} ${cy} L${cx} ${cy + s + 0.7} L${cx - s - 0.7} ${cy} Z`, style: { fill, stroke: "var(--surface)", "stroke-width": 1.4 } });
  return E("circle", { cx, cy, r: s, style: { fill, stroke: "var(--surface)", "stroke-width": 1.4 } });
}
const pDepth = new Plot("c-depth", { w: 820, h: 420, m: { t: 18, r: 150, b: 46, l: 56 }, gridY: true, xTicks: 6 });

function drawDepth() {
  const p = pDepth, data = D.depth_swin[dpState.ds];
  const depths = [1, 2, 3, 4, 5, 6];
  const arms = DEPTH_ARMS.filter(a => data[a]);
  const mean = (a, d) => data[a][String(d)] && data[a][String(d)].mean;
  const sd = (a, d) => data[a][String(d)] && data[a][String(d)].sd;
  p.clear();

  if (dpState.view === "acc") {
    let lo = 1e9, hi = -1e9;
    arms.forEach(a => depths.forEach(d => { const m = mean(a, d), s = sd(a, d); if (m != null) { lo = Math.min(lo, m - s); hi = Math.max(hi, m + s); } }));
    const pad = (hi - lo) * 0.08 || 1;
    p.domain([0.7, 6.3], [lo - pad, hi + pad]);
    p.o.xLabel = "Swin target depth (transformer blocks)"; p.o.yLabel = "test accuracy (%)";
    p.o.xFmt = v => String(Math.round(v)); p.axes();
    const ends = [];
    arms.forEach(a => {
      const S = DEPTH_STYLE[a];
      p.area(depths.map(d => [d, mean(a, d) + sd(a, d), mean(a, d) - sd(a, d)]), { fill: S.c, opacity: 0.10 });
      depths.forEach(d => { const m = mean(a, d), s = sd(a, d); p.gPlot.appendChild(E("line", { x1: p.x(d), x2: p.x(d), y1: p.y(m - s), y2: p.y(m + s), style: { stroke: S.c, "stroke-width": 1.2, opacity: 0.6 } })); });
      p.path(depths.map(d => [d, mean(a, d)]), { stroke: S.c, "stroke-width": S.w, "stroke-dasharray": S.dash });
      depths.forEach(d => p.gPlot.appendChild(dpMarker(p, p.x(d), p.y(mean(a, d)), S.mark, S.c)));
      ends.push({ a, y: mean(a, 6) });
    });
    const used = [];
    ends.sort((x, y) => y.y - x.y).forEach(e => { let yy = p.y(e.y); while (used.some(u => Math.abs(u - yy) < 13)) yy += 13; used.push(yy); p.dlabel(p.o.m.l + p.iw + 8, yy + 3.4, DEPTH_LAB[e.a], DEPTH_STYLE[e.a].c); });
  } else {
    // advantage view: FAct minus a baseline, across depth, with a zero reference line
    const base = dpState.view === "vg" ? "gelu" : "fact_k2_global_frozen";
    const diffs = depths.map(d => (mean("fact_fixed", d) != null && mean(base, d) != null) ? mean("fact_fixed", d) - mean(base, d) : null).filter(v => v != null);
    const lo = Math.min(0, ...diffs), hi = Math.max(0, ...diffs);
    const pad = (hi - lo) * 0.18 || 0.5;
    p.domain([0.7, 6.3], [lo - pad, hi + pad]);
    p.o.xLabel = "Swin target depth (transformer blocks)";
    p.o.yLabel = "Frozen FAct − " + DEPTH_LAB[base] + " (pp)";
    p.o.xFmt = v => String(Math.round(v)); p.axes();
    p.hline(0, { stroke: "var(--ink-muted)", "stroke-width": 1.2, "stroke-dasharray": "4 3" });
    const pts = depths.map(d => [d, (mean("fact_fixed", d) != null && mean(base, d) != null) ? mean("fact_fixed", d) - mean(base, d) : null]);
    p.path(pts, { stroke: "var(--s-fact)", "stroke-width": 2.6 });
    depths.forEach(d => { const v = pts[d - 1][1]; if (v != null) p.gPlot.appendChild(dpMarker(p, p.x(d), p.y(v), "diamond", v >= 0 ? "var(--s-fact)" : "var(--s-gelu)")); });
    p.dlabel(p.o.m.l + 6, p.y(hi) + 2, "above 0: Frozen FAct ahead", "var(--ink-muted)");
  }

  // hover: snap to the nearest depth, report all three arms + the two differences
  p.overlay((ux, uy) => {
    const d = clamp(Math.round(p.ix(ux)), 1, 6);
    const rows = arms.map(a => ({ l: DEPTH_LAB[a], v: fx(mean(a, d)) + " ± " + fx(sd(a, d)), c: DEPTH_STYLE[a].c }));
    const fa = mean("fact_fixed", d);
    if (data.gelu) rows.push({ l: "FAct − GELU", v: sgn(fa - mean("gelu", d)) + " pp" });
    if (data.fact_k2_global_frozen) rows.push({ l: "FAct − GELU-init", v: sgn(fa - mean("fact_k2_global_frozen", d)) + " pp" });
    p.showTip(p.x(d), uy, tipRows(rows, "Swin-d" + d + " · " + DS[dpState.ds]));
  });

  $("#dp-title").textContent = (dpState.view === "acc" ? "Test accuracy vs depth — " : "Frozen FAct advantage vs depth — ") + DS[dpState.ds];
  legend("l-depth", dpState.view === "acc"
    ? DEPTH_ARMS.filter(a => data[a]).map(a => ({ l: DEPTH_LAB[a], c: DEPTH_STYLE[a].c, dash: DEPTH_STYLE[a].dash ? "1" : null }))
    : [{ l: "Frozen FAct − baseline", c: "var(--s-fact)" }, { l: "zero (parity)", c: "var(--ink-muted)", dash: "1" }]);
  table("t-depth", ["Depth"].concat(DEPTH_ARMS.filter(a => data[a]).map(a => DEPTH_LAB[a])),
    depths.map(d => [String(d)].concat(DEPTH_ARMS.filter(a => data[a]).map(a => fx(mean(a, d)) + " ± " + fx(sd(a, d))))), -1);
}
pDepth.redraw = drawDepth;
seg("dp-ds", DSK.map(k => ({ k, l: DS[k] })), "food101", k => { dpState.ds = k; drawDepth(); });
seg("dp-view", [{ k: "acc", l: "Accuracy" }, { k: "vg", l: "Δ vs GELU" }, { k: "vgi", l: "Δ vs GELU-init" }], "acc", k => { dpState.view = k; drawDepth(); });
drawDepth();
</script>
<script>
/* Report our rendered height so the embedding figure can size its iframe. */
(function () {
  var last = 0;
  function measure() {
    /* The root element's border box spans all in-flow content and is NOT floored by the
       iframe's own viewport height, so it both grows to fit a tall figure and shrinks to
       a short one. (body.scrollHeight is floored by the viewport and would pad the frame.) */
    return Math.ceil(document.documentElement.getBoundingClientRect().height);
  }
  function report() {
    var h = measure();
    if (h && Math.abs(h - last) > 1) {
      last = h;
      parent.postMessage({ tmlrFigHeight: h, tmlrFigId: "fig-v2-depth" }, "*");
    }
  }
  window.addEventListener("load", report);
  window.addEventListener("resize", report);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(report);
    ro.observe(document.documentElement);
    if (document.body) ro.observe(document.body);
  }
  /* Fonts and the SVG charts can settle after load; re-measure for a while so a late
     layout change (e.g. the lower chart drawing) never leaves the iframe clipped. */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(report);
  [120, 600, 1200, 2500, 4000].forEach(function (t) { setTimeout(report, t); });
})();
