<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion & Time Explorer</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <!-- Chart.js for the distance-time graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-deep: #05070d;
            --bg-gradient: radial-gradient(circle at center, #1a1d2b 0%, #05070d 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent-cyan: #22d3ee;
            --accent-violet: #a78bfa;
            --accent-amber: #fbbf24;
            --text-main: #f8fafc;
            --text-dim: #9aa4b8;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: 320px 1fr auto;
            gap: 2rem;
            align-items: start;
        }

        /* Panels */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: var(--transition);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #fff, var(--text-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Controls */
        .control-group {
            margin-bottom: 2rem;
        }

        .slider-container {
            margin-bottom: 1.5rem;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .label-row label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .value-badge {
            font-family: var(--font-mono);
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--accent-cyan);
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 100%;
            appearance: none;
            background: rgba(255,255,255,0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--text-main);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: var(--transition);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: var(--accent-cyan);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        button {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            font-family: var(--font-sans);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        button:hover {
            background: rgba(255,255,255,0.15);
            border-color: var(--accent-cyan);
        }

        button.primary {
            background: var(--accent-cyan);
            color: #000;
            border: none;
        }

        button.primary:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
        }

        /* Stage */
        .stage {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            width: 100%;
        }

        .visualizer-box {
            position: relative;
            width: 100%;
            height: 300px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
        }

        #track-canvas, #pendulum-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Graph Panel */
        .graph-container {
            position: relative;
            height: 450px;
            width: 400px;
        }

        canvas#graphCanvas {
            max-width: 100% !important;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .app-container {
                grid-template-columns: 1fr;
                justify-items: center;
            }
            .panel { width: 100%; max-width: 600px; }
            .stage { width: 100%; max-width: 800px; }
            .graph-container { width: 100%; }
        }

        /* Special Effects */
        .glow-finish {
            position: absolute;
            right: 50px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent-amber);
            box-shadow: 0 0 20px var(--accent-amber);
            opacity: 0.3;
            pointer-events: none;
        }

        .finish-active {
            animation: pulse-glow 1s infinite alternate;
            opacity: 1 !important;
        }

        @keyframes pulse-glow {
            from { box-shadow: 0 0 10px var(--accent-amber); }
            to { box-shadow: 0 0 30px var(--accent-amber), 0 0 50px var(--accent-amber); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Left Column: Controls -->
        <aside class="panel">
            <h1>Motion Explorer</h1>
            
            <div class="control-group">
                <h2><span style="color: var(--accent-cyan)">●</span> Vehicle Speed</h2>
                <div class="slider-container">
                    <div class="label-row">
                        <label>Car A</label>
                        <span id="valA" class="value-badge">5.0 m/s</span>
                    </div>
                    <input type="range" id="speedA" min="0" max="20" step="0.1" value="5">
                </div>
                <div class="slider-container">
                    <div class="label-row">
                        <label>Car B</label>
                        <span id="valB" class="value-badge">10.0 m/s</span>
                    </div>
                    <input type="range" id="speedB" min="0" max="20" step="0.1" value="10">
                </div>
            </div>

            <div class="control-group">
                <h2><span style="color: var(--accent-violet)">●</span> Pendulum</h2>
                <div class="slider-container">
                    <div class="label-row">
                        <label>String Length</label>
                        <span id="valLen" class="value-badge">1.0 m</span>
                    </div>
                    <input type="range" id="pendLength" min="0.2" max="2.0" step="0.1" value="1.0">
                </div>
            </div>

            <div class="control-group">
                <h2><span style="color: var(--text-main)">●</span> Simulation</h2>
                <div class="btn-grid">
                    <button id="btnStart" class="primary">Start</button>
                    <button id="btnPause">Pause</button>
                    <button id="btnReset">Reset All</button>
                    <button id="btnResetPend">Reset Pendulum</button>
                </div>
            </div>

            <div class="control-group" style="margin-top: 2rem; border-top: 1px solid var(--panel-border); padding-top: 1.5rem;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem; color: var(--text-dim);">
                    <input type="checkbox" id="toggleGraph" checked> Show Distance Graph
                </label>
            </div>
        </aside>

        <!-- Center Column: Visual Stage -->
        <main class="stage">
            <div class="visualizer-box">
                <div id="finishLine" class="glow-finish"></div>
                <canvas id="track-canvas"></canvas>
            </div>
            <div class="visualizer-box">
                <canvas id="pendulum-canvas"></canvas>
            </div>
        </main>

        <!-- Right Column: Graph -->
        <aside id="graphPanel" class="panel">
            <h2>Distance vs Time</h2>
            <div class="graph-container">
                <canvas id="graphCanvas"></canvas>
            </div>
            <p style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-dim); line-height: 1.4;">
                The slope of the line represents the speed. A steeper line means a faster vehicle.
            </p>
        </aside>
    </div>

    <script>
        /**
         * STATE MANAGEMENT
         */
        const state = {
            running: false,
            time: 0,
            lastTimestamp: 0,
            carA: { distance: 0, speed: 5, color: '#22d3ee' },
            carB: { distance: 0, speed: 10, color: '#a78bfa' },
            pendulum: { length: 1.0, angle: Math.PI/4, count: 0, lastDir: 1, phase: 0 },
            trackLength: 200,
        };

        /**
         * DOM ELEMENTS
         */
        const canvasTrack = document.getElementById('track-canvas');
        const ctxTrack = canvasTrack.getContext('2d');
        const canvasPend = document.getElementById('pendulum-canvas');
        const ctxPend = canvasPend.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');

        const speedAInput = document.getElementById('speedA');
        const speedBInput = document.getElementById('speedB');
        const lenInput = document.getElementById('pendLength');
        const valA = document.getElementById('valA');
        const valB = document.getElementById('valB');
        const valLen = document.getElementById('valLen');
        const finishLine = document.getElementById('finishLine');

        /**
         * GRAPH INITIALIZATION (Chart.js)
         */
        const chart = new Chart(graphCanvas, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Car A',
                        borderColor: state.carA.color,
                        borderWidth: 3,
                        pointRadius: 0,
                        data: [],
                        tension: 0,
                    },
                    {
                        label: 'Car B',
                        borderColor: state.carB.color,
                        borderWidth: 3,
                        pointRadius: 0,
                        data: [],
                        tension: 0,
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { 
                        title: { display: true, text: 'Time (s)', color: '#64748b' },
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#64748b', font: { family: 'JetBrains Mono' } }
                    },
                    y: { 
                        title: { display: true, text: 'Distance (m)', color: '#64748b' },
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#64748b', font: { family: 'JetBrains Mono' } },
                        min: 0,
                        max: state.trackLength
                    }
                },
                plugins: {
                    legend: { labels: { color: '#f8fafc', font: { family: 'Inter' } } }
                }
            }
        });

        /**
         * PHYSICS & LOGIC
         */
        function update(dt) {
            // FIX 2: Move slider value assignments OUTSIDE the running check.
            // This ensures that changing a slider updates state and thus pixels in draw() even when paused.
            state.carA.speed = parseFloat(speedAInput.value);
            state.carB.speed = parseFloat(speedBInput.value);
            state.pendulum.length = parseFloat(lenInput.value);

            if (!state.running) return;

            state.time += dt;

            // Update Cars
            if (state.carA.distance < state.trackLength) {
                state.carA.distance += state.carA.speed * dt;
                if (state.carA.distance > state.trackLength) state.carA.distance = state.trackLength;
            }
            if (state.carB.distance < state.trackLength) {
                state.carB.distance += state.carB.speed * dt;
                if (state.carB.distance > state.trackLength) state.carB.distance = state.trackLength;
            }

            // Pendulum Physics: T = 2*pi * sqrt(L/g)
            const g = 9.81;
            const omega = Math.sqrt(g / state.pendulum.length);
            state.pendulum.phase += omega * dt;
            
            const newAngle = (Math.PI/4) * Math.cos(state.pendulum.phase);
            
            if (state.pendulum.lastDir === 1 && newAngle < 0) {
                state.pendulum.lastDir = -1;
            } else if (state.pendulum.lastDir === -1 && newAngle > 0) {
                state.pendulum.count++;
                state.pendulum.lastDir = 1;
            }
            state.pendulum.angle = newAngle;

            // Update Graph every ~0.1s
            if (Math.floor(state.time * 10) > Math.floor((state.time - dt) * 10)) {
                chart.data.labels.push(state.time.toFixed(1));
                chart.data.datasets[0].data.push(state.carA.distance);
                chart.data.datasets[1].data.push(state.carB.distance);
                
                if (chart.data.labels.length > 100) {
                    chart.data.labels.shift();
                    chart.data.datasets[0].data.shift();
                    chart.data.datasets[1].data.shift();
                }
                chart.update('none');
            }
        }

        /**
         * RENDERING
         */
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvasTrack.width = canvasTrack.clientWidth * dpr;
            canvasTrack.height = canvasTrack.clientHeight * dpr;
            ctxTrack.scale(dpr, dpr);

            canvasPend.width = canvasPend.clientWidth * dpr;
            canvasPend.height = canvasPend.clientHeight * dpr;
            ctxPend.scale(dpr, dpr);
        }

        function draw() {
            // --- Track Drawing ---
            const w = canvasTrack.clientWidth;
            const h = canvasTrack.clientHeight;
            ctxTrack.clearRect(0, 0, w, h);

            ctxTrack.strokeStyle = 'rgba(255,255,255,0.1)';
            ctxTrack.lineWidth = 4;
            ctxTrack.beginPath();
            ctxTrack.moveTo(50, h/2 + 20);
            ctxTrack.lineTo(w - 50, h/2 + 20);
            ctxTrack.stroke();

            ctxTrack.setLineDash([10, 10]);
            ctxTrack.strokeStyle = 'rgba(255,255,255,0.2)';
            ctxTrack.lineWidth = 2;
            ctxTrack.beginPath();
            ctxTrack.moveTo(50, h/2 + 20);
            ctxTrack.lineTo(w - 50, h/2 + 20);
            ctxTrack.stroke();
            ctxTrack.setLineDash([]);

            const drawCar = (car, offset, color) => {
                const x = 50 + (car.distance / state.trackLength) * (w - 100);
                const y = h/2 + 20 + offset;
                
                ctxTrack.fillStyle = color;
                ctxTrack.beginPath();
                ctxTrack.roundRect(x - 20, y - 10, 40, 20, 5);
                ctxTrack.fill();
                
                ctxTrack.fillStyle = '#333';
                ctxTrack.beginPath();
                ctxTrack.arc(x - 10, y + 10, 5, 0, Math.PI*2);
                ctxTrack.arc(x + 10, y + 10, 5, 0, Math.PI*2);
                ctxTrack.fill();

                ctxTrack.fillStyle = '#fff';
                ctxTrack.font = '12px JetBrains Mono';
                ctxTrack.textAlign = 'center';
                ctxTrack.fillText(`${car.distance.toFixed(1)}m`, x, y - 20);
            };

            drawCar(state.carA, -30, state.carA.color);
            drawCar(state.carB, 30, state.carB.color);

            if (state.carA.distance >= state.trackLength || state.carB.distance >= state.trackLength) {
                finishLine.classList.add('finish-active');
            } else {
                finishLine.classList.remove('finish-active');
            }

            // --- Pendulum Drawing ---
            const pw = canvasPend.clientWidth;
            const ph = canvasPend.clientHeight;
            ctxPend.clearRect(0, 0, pw, ph);

            const pivotX = pw / 2;
            const pivotY = 40;
            const lengthPx = state.pendulum.length * 100; 
            const bobX = pivotX + Math.sin(state.pendulum.angle) * lengthPx;
            const bobY = pivotY + Math.cos(state.pendulum.angle) * lengthPx;

            ctxPend.strokeStyle = '#64748b';
            ctxPend.lineWidth = 2;
            ctxPend.beginPath();
            ctxPend.moveTo(pivotX, pivotY);
            ctxPend.lineTo(bobX, bobY);
            ctxPend.stroke();

            ctxPend.fillStyle = '#a78bfa';
            ctxPend.shadowBlur = 15;
            ctxPend.shadowColor = 'rgba(167, 139, 250, 0.5)';
            ctxPend.beginPath();
            ctxPend.arc(bobX, bobY, 12, 0, Math.PI*2);
            ctxPend.fill();
            ctxPend.shadowBlur = 0;

            ctxPend.fillStyle = '#fff';
            ctxPend.beginPath();
            ctxPend.arc(pivotX, pivotY, 4, 0, Math.PI*2);
            ctxPend.fill();

            ctxPend.fillStyle = '#f8fafc';
            ctxPend.font = 'bold 16px Inter';
            ctxPend.textAlign = 'left';
            ctxPend.fillText(`Oscillations: ${state.pendulum.count}`, 20, 30);
        }

        function loop(timestamp) {
            if (!state.lastTimestamp) state.lastTimestamp = timestamp;
            const dt = (timestamp - state.lastTimestamp) / 1000;
            state.lastTimestamp = timestamp;

            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        /**
         * EVENT LISTENERS
         */
        speedAInput.oninput = () => valA.textContent = `${parseFloat(speedAInput.value).toFixed(1)} m/s`;
        speedBInput.oninput = () => valB.textContent = `${parseFloat(speedBInput.value).toFixed(1)} m/s`;
        lenInput.oninput = () => valLen.textContent = `${parseFloat(lenInput.value).toFixed(1)} m`;

        const btnStart = document.getElementById('btnStart');
        btnStart.onclick = () => {
            state.running = true;
            btnStart.textContent = 'Running...';
        };

        document.getElementById('btnPause').onclick = (e) => {
            state.running = !state.running;
            e.target.textContent = state.running ? 'Pause' : 'Resume';
            btnStart.textContent = state.running ? 'Running...' : 'Start';
        };

        document.getElementById('btnReset').onclick = () => {
            state.running = false;
            state.time = 0;
            state.carA.distance = 0;
            state.carB.distance = 0;
            state.pendulum.count = 0;
            state.pendulum.phase = 0;
            state.pendulum.angle = Math.PI/4;
            
            // FIX 3: Removed lines that forced speed sliders back to defaults (5 and 10)
            // Users can now maintain their custom speeds across resets.

            document.getElementById('btnPause').textContent = 'Pause';
            btnStart.textContent = 'Start';
            
            chart.data.labels = [];
            chart.data.datasets[0].data = [];
            chart.data.datasets[1].data = [];
            chart.update();
        };

        document.getElementById('btnResetPend').onclick = () => {
            // FIX 1: Ensure resetting state variables triggers a visual jump and redraw
            state.pendulum.count = 0;
            state.pendulum.phase = 0;
            state.pendulum.angle = Math.PI/4; // Reset to start position
            state.pendulum.lastDir = 1;
        };

        document.getElementById('toggleGraph').onchange = (e) => {
            document.getElementById('graphPanel').style.display = e.target.checked ? 'block' : 'none';
        };

        window.addEventListener('resize', resize);
        
        resize();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
