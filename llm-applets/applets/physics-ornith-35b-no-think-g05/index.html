<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Magnet Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #0f172a;
            --bg-bottom: #020617;
            --surface: rgba(30, 41, 59, 0.7);
            --border: rgba(148, 163, 184, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-yellow: #fbbf24;
            --accent-cyan: #22d3ee;
            --font-stack: 'Nunito', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
            font-family: var(--font-stack);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Layout */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
        }

        /* Canvas Stage */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }

        /* UI Overlay */
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        .pointer-events-auto { pointer-events: auto; }

        /* Header / Top Controls */
        .top-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            align-items: center;
        }

        .pill-toggle {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px;
            display: flex;
            gap: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .pill-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px 24px;
            border-radius: 999px;
            font-family: var(--font-stack);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pill-btn.active {
            background: var(--accent-cyan);
            color: #0f172a;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
        }

        .pill-btn:hover:not(.active) {
            color: var(--text-primary);
            background: rgba(255,255,255,0.05);
        }

        /* Floating Action Buttons */
        .fab-group {
            position: absolute;
            top: 100px;
            right: 40px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .fab {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .fab:hover { transform: translateY(-2px) scale(1.05); background: rgba(51, 65, 85, 0.9); }
        .fab:active { transform: scale(0.95); }
        
        .fab svg { width: 24px; height: 24px; fill: currentColor; transition: transform 0.3s ease; }

        /* Bottom Tray (Test Mode) */
        .tray-container {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 16px;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
            
            /* FIX #5: Smooth fade-in animation */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tray-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .tray-item {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .tray-item:hover { background: rgba(255,255,255,0.08); transform: translateY(-4px); }
        .tray-item.selected { border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(34, 211, 238, 0.2); background: rgba(34, 211, 238, 0.1); }
        
        .tray-icon { font-size: 32px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

        /* Feedback Toast */
        #feedback-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-cyan);
            padding: 16px 32px;
            border-radius: 16px;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 18px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        #feedback-toast.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* Responsive */
        @media (max-width: 768px) {
            .fab-group { top: auto; bottom: 140px; right: 20px; flex-direction: row; }
            .tray-container { padding: 12px; gap: 8px; overflow-x: auto; justify-content: flex-start; }
            .tray-item { width: 60px; height: 60px; min-width: 60px; }
        }
    </style>
</head>
<body>

<div id="app">
    <canvas id="sim-canvas"></canvas>

    <div class="ui-layer">
        <!-- Top Controls -->
        <div class="top-bar pointer-events-auto">
            <div class="pill-toggle">
                <button class="pill-btn active" onclick="setMode('test')">Test Materials</button>
                <button class="pill-btn" onclick="setMode('two-magnets')">Two Magnets</button>
            </div>
        </div>

        <!-- Floating Actions -->
        <div class="fab-group pointer-events-auto">
            <button class="fab" id="flip-btn" onclick="flipPolarity()" title="Flip Magnet Polarity">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
            <button class="fab" id="field-btn" onclick="toggleFieldLines()" title="Toggle Field Lines">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
            </button>
        </div>

        <!-- Bottom Tray (Test Mode) -->
        <div class="tray-container pointer-events-auto" id="object-tray">
            <div class="tray-item selected" onclick="selectObject(0)">
                <span class="tray-icon">📌</span>
            </div>
            <div class="tray-item" onclick="selectObject(1)">
                <span class="tray-icon">📎</span>
            </div>
            <div class="tray-item" onclick="selectObject(2)">
                <span class="tray-icon">🪙</span>
            </div>
            <div class="tray-item" onclick="selectObject(3)">
                <span class="tray-icon">✏️</span>
            </div>
            <div class="tray-item" onclick="selectObject(4)">
                <span class="tray-icon">🥄</span>
            </div>
            <div class="tray-item" onclick="selectObject(5)">
                <span class="tray-icon">🧽</span>
            </div>
        </div>

        <!-- Feedback Toast -->
        <div id="feedback-toast"></div>
    </div>
</div>

<script>
/**
 * Interactive Magnet Explorer
 * Pure JS + Canvas implementation for performance and zero-dependency.
 */

// --- Configuration & State ---
const CONFIG = {
    magnetWidth: 180,
    magnetHeight: 60,
    magnetRadius: 12,
    forceConstant: 3500, 
    damping: 0.92,       
    snapThreshold: 40,   
    colors: {
        n: '#ef4444',
        s: '#3b82f6',
        field: 'rgba(34, 211, 238, 0.5)',
        grid: 'rgba(255, 255, 255, 0.03)'
    }
};

const STATE = {
    mode: 'test', 
    showFieldLines: true,
    dragging: false,
    dragOffset: { x: 0, y: 0 },
    
    magnetA: { x: 0, y: 0, vx: 0, vy: 0, angle: 0, vAngle: 0, flipped: false },
    
    magnetB: { x: 0, y: 0, vx: 0, vy: 0, angle: 0, vAngle: 0, flipped: false },

    testObj: { 
        x: 0, y: 0, targetX: 0, targetY: 0, 
        isMagnetic: true, 
        stuck: false,
        typeIndex: 0 
    }
};

// --- Initialization ---
const canvas = document.getElementById('sim-canvas');
const ctx = canvas.getContext('2d', { alpha: false });
let width, height;

function resize() {
    const dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    
    STATE.magnetA.x = width / 2 - CONFIG.magnetWidth / 2;
    STATE.magnetA.y = height / 2 - CONFIG.magnetHeight / 2;
    
    if (STATE.mode === 'two-magnets') {
        STATE.magnetB.x = width / 2 + 100;
        STATE.magnetB.y = height / 2 - CONFIG.magnetHeight / 2;
    } else {
        STATE.testObj.x = width / 2 + 150;
        STATE.testObj.y = height / 2;
    }
}

window.addEventListener('resize', resize);
resize();

// --- Physics Engine (Custom Spring/Force) ---

function updatePhysics() {
    const ma = STATE.magnetA;
    const mb = STATE.magnetB;
    
    // Helper: Get pole positions based on magnet state and angle
    function getPoles(m, isFlipped) {
        const w = CONFIG.magnetWidth / 2;
        
        return {
            N: { x: m.x + (isFlipped ? -w : w), y: m.y, type: 'N' }, 
            S: { x: m.x + (isFlipped ? w : -w), y: m.y, type: 'S' }  
        };
    }

    if (STATE.mode === 'test') {
        const obj = STATE.testObj;
        
        if (obj.stuck) return;

        const polesA = getPoles(ma, ma.flipped);
        let forceX = 0, forceY = 0;
        let nearestDist = Infinity;
        let attractPole = null;

        const objPos = { x: obj.x + 25, y: obj.y + 25 }; 
        
        [polesA.N, polesA.S].forEach(p => {
            const dx = objPos.x - p.x;
            const dy = objPos.y - p.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < nearestDist) {
                nearestDist = dist;
                attractPole = p;
            }
        });

        // Apply force if magnetic and within range
        if (obj.isMagnetic && nearestDist < 300) {
            const dx = objPos.x - attractPole.x;
            const dy = objPos.y - attractPole.y;
            const distSq = dx*dx + dy*dy;
            
            // FIX #5: Cap force to prevent erratic behavior at close range
            let forceMag = CONFIG.forceConstant / (distSq * 0.05); 
            if (forceMag > 20) forceMag = 20;

            const dirX = dx / Math.sqrt(distSq);
            const dirY = dy / Math.sqrt(distSq);

            forceX += dirX * forceMag;
            forceY += dirY * forceMag;

            // Snap logic
            if (nearestDist < CONFIG.snapThreshold) {
                obj.stuck = true;
                obj.vx = 0; obj.vy = 0;
                showFeedback("Attracted! 🧲");
            }
        }

        obj.vx = (obj.vx + forceX * 0.1) * CONFIG.damping;
        obj.vy = (obj.vy + forceY * 0.1) * CONFIG.damping;
        
        if (STATE.mode === 'test' && !obj.stuck) {
            obj.x += obj.vx;
            obj.y += obj.vy;
            
            // Keep in bounds roughly
            if(obj.x < 50) { obj.x = 50; obj.vx *= -0.5; }
            if(obj.x > width - 50) { obj.x = width - 50; obj.vx *= -0.5; }
        }

    } else {
        // Two Magnets Mode
        
        const polesA = getPoles(ma, ma.flipped);
        const polesB = getPoles(mb, mb.flipped);
        
        let totalFx = 0, totalFy = 0;
        
        const polesAList = [polesA.N, polesA.S];
        const polesBList = [polesB.N, polesB.S];

        // FIX #2: Proper collision resolution. 
        // We calculate forces first, then apply position correction to prevent overlap.
        
        const getCharge = (type) => type === 'N' ? 1 : -1;
        
        for (let pa of polesAList) {
            for (let pb of polesBList) {
                const dx = pb.x - pa.x;
                const dy = pb.y - pa.y;
                const distSq = dx*dx + dy*dy;
                
                if (distSq < 100) continue; 
                
                const chargeProduct = getCharge(pa.type) * getCharge(pb.type); 
                
                let forceMag = 0;
                if (STATE.mode === 'two-magnets') {
                    const isLike = chargeProduct > 0; 
                    const k = CONFIG.forceConstant / distSq; 
                    
                    if (isLike) forceMag = -k * 20; // Repel strongly
                    else forceMag = k * 15;          // Attract
                }

                const fx = (dx / Math.sqrt(distSq)) * forceMag;
                const fy = (dy / Math.sqrt(distSq)) * forceMag;

                if (!STATE.dragging) {
                    mb.vx += fx;
                    mb.vy += fy;
                    // FIX #2: Apply equal and opposite force to Magnet A so it moves too
                    ma.vx -= fx * 0.5; 
                    ma.vy -= fy * 0.5;
                } else {
                    // If dragging B, apply reaction forces to A (simulating the push/pull)
                    ma.vx -= fx * 0.2; 
                    ma.vy -= fy * 0.2;
                }
            }
        }

        // Apply velocity to B if not stuck
        mb.x += mb.vx;
        mb.y += mb.vy;
        mb.vx *= CONFIG.damping;
        mb.vy *= CONFIG.damping;

        // FIX #2: Also apply velocity to Magnet A so it responds to forces when not dragged
        ma.x += ma.vx;
        ma.y += ma.vy;
        ma.vx *= CONFIG.damping;
        ma.vy *= CONFIG.damping;

        // Keep B in bounds (soft walls)
        const margin = 50;
        if (mb.x < margin) { mb.x = margin; mb.vx *= -0.5; }
        if (mb.x > width - margin - CONFIG.magnetWidth) { mb.x = width - margin - CONFIG.magnetWidth; mb.vx *= -0.5; }
        if (mb.y < margin) { mb.y = margin; mb.vy *= -0.5; }
        if (mb.y > height - margin - CONFIG.magnetHeight) { mb.y = height - margin - CONFIG.magnetHeight; mb.vy *= -0.5; }

        // Keep A in bounds too
        if (ma.x < margin) { ma.x = margin; ma.vx *= -0.5; }
        if (ma.x > width - margin - CONFIG.magnetWidth) { ma.x = width - margin - CONFIG.magnetWidth; ma.vx *= -0.5; }
        if (ma.y < margin) { ma.y = margin; ma.vy *= -0.5; }
        if (ma.y > height - margin - CONFIG.magnetHeight) { ma.y = height - margin - CONFIG.magnetHeight; ma.vy *= -0.5; }

        // FIX #2: Rigid Body Collision Resolution
        const ax = ma.x, ay = ma.y, aw = CONFIG.magnetWidth, ah = CONFIG.magnetHeight;
        const bx = mb.x, by = mb.y, bw = CONFIG.magnetWidth, bh = CONFIG.magnetHeight;

        // Check AABB overlap
        if (ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by) {
            // Calculate penetration depth on both axes
            const overlapX = (aw/2 + bw/2) - Math.abs((ax+aw/2) - (bx+bw/2));
            const overlapY = (ah/2 + bh/2) - Math.abs((ay+ah/2) - (by+bh/2));

            // Push apart along the axis of least penetration
            if (overlapX < overlapY) {
                // Horizontal separation
                if (ax < bx) mb.x += overlapX; else mb.x -= overlapX;
                const bounce = 0.3;
                if (mb.vx > 0) mb.vx *= -bounce; else mb.vx *= -bounce;
            } else {
                // Vertical separation
                if (ay < by) mb.y += overlapY; else mb.y -= overlapY;
                const bounce = 0.3;
                if (mb.vy > 0) mb.vy *= -bounce; else mb.vy *= -bounce;
            }
        }
    }
}

// --- Rendering ---

function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawMagnet(m) {
    const w = CONFIG.magnetWidth;
    const h = CONFIG.magnetHeight;
    const cx = m.x + w/2;
    const cy = m.y + h/2;

    ctx.save();
    ctx.translate(cx, cy);
    
    // Shadow
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 15;
    ctx.shadowOffsetY = 8;

    // Body Base (Dark metallic frame)
    drawRoundedRect(-w/2, -h/2, w, h, CONFIG.magnetRadius);
    ctx.fillStyle = '#334155';
    ctx.fill();

    const leftType = m.flipped ? 'N' : 'S';
    const rightType = m.flipped ? 'S' : 'N';
    
    ctx.save();
    ctx.clip(); 
    
    // Left Color
    drawRoundedRect(-w/2, -h/2, w/2, h, 0);
    ctx.fillStyle = leftType === 'N' ? CONFIG.colors.n : CONFIG.colors.s;
    ctx.fill();

    // Right Color
    drawRoundedRect(0, -h/2, w/2, h, 0);
    ctx.fillStyle = rightType === 'N' ? CONFIG.colors.n : CONFIG.colors.s;
    ctx.fill();
    
    // Subtle inner shine for "magnet" look
    const grad = ctx.createLinearGradient(0, -h/2, 0, h/2);
    grad.addColorStop(0, 'rgba(255,255,255,0.15)');
    grad.addColorStop(0.4, 'rgba(255,255,255,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.1)');
    
    ctx.fillStyle = grad;
    drawRoundedRect(-w/2, -h/2, w, h, 0);
    ctx.fill();

    ctx.restore(); // Restore clip

    // Border
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 3;
    drawRoundedRect(-w/2, -h/2, w, h, CONFIG.magnetRadius);
    ctx.stroke();

    // Text Labels
    ctx.shadowBlur = 4;
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px Nunito';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    const labelOffset = w/4;
    // Labels stay on the pole (Left is LeftType, Right is RightType)
    ctx.fillText(leftType === 'N' ? 'N' : 'S', -labelOffset, 0);
    ctx.fillText(rightType === 'N' ? 'N' : 'S', labelOffset, 0);

    ctx.restore();
}

function drawFieldLines() {
    if (!STATE.showFieldLines) return;

    const ma = STATE.magnetA;
    const mb = STATE.magnetB;
    
    function getPoles(m, flipped) {
        const w = CONFIG.magnetWidth / 2;
        return {
            N: { x: m.x + (flipped ? -w : w), y: m.y, type: 'N' },
            S: { x: m.x + (flipped ? w : -w), y: m.y, type: 'S' }
        };
    }

    const polesA = getPoles(ma, ma.flipped);
    
    ctx.strokeStyle = CONFIG.colors.field;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);

    if (STATE.mode === 'test') {
        const obj = STATE.testObj;
        if (!obj.isMagnetic && !obj.stuck) return; 
        
        const cx = ma.x + CONFIG.magnetWidth/2;
        const cy = ma.y + CONFIG.magnetHeight/2;
        
        ctx.beginPath();
        const nX = polesA.N.x;
        const sX = polesA.S.x;
        const objX = obj.x + 25;
        const objY = obj.y + 25;

        for(let i=-1; i<=1; i++) {
            ctx.moveTo(nX, ma.y);
            ctx.quadraticCurveTo((nX+objX)/2, ma.y + i*40, objX, objY);
            ctx.quadraticCurveTo((sX+objX)/2, ma.y + i*40, sX, ma.y);
        }
    } else {
        const polesB = getPoles(mb, mb.flipped);
        
        // Determine interaction type based on facing poles (Right of A vs Left of B)
        const rightA = ma.flipped ? 'S' : 'N';
        const leftB = mb.flipped ? 'N' : 'S';
        const isAttract = (rightA !== leftB);

        if (isAttract) {
            // Connect N to S directly
            ctx.beginPath();
            for(let i=0; i<3; i++) {
                const offset = (i-1) * 25;
                ctx.moveTo(polesA.N.x, polesA.N.y);
                const cpX = (polesA.N.x + polesB.S.x)/2;
                const cpY = (polesA.N.y + polesB.S.y)/2 + offset;
                ctx.quadraticCurveTo(cpX, cpY, polesB.S.x, polesB.S.y);
            }
        } else {
            // Repulsion: Lines bow outward
            ctx.beginPath();
            for(let i=0; i<3; i++) {
                const startPole = (rightA === 'N') ? polesA.N : polesA.S;
                const endPole = (leftB === 'S') ? polesB.S : polesB.N; 
                
                const startX = startPole.x;
                const startY = startPole.y;
                
                ctx.moveTo(startX, startY);
                const midX = (startX + endPole.x) / 2;
                const bulge = 100 + i*30;
                
                const dx = endPole.x - startX;
                const dy = endPole.y - startY;
                const len = Math.sqrt(dx*dx+dy*dy);
                if (len === 0) continue;
                
                // Perpendicular vector for bulge
                const perpX = -dy / len * bulge;
                const perpY = dx / len * bulge;

                ctx.quadraticCurveTo(midX + perpX, (startY + endPole.y) / 2 + perpY, startX - (endPole.x-startX)*0.5, startY - (endPole.y-startY)*0.5);
            }
        }
    }
    
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawObject() {
    if (STATE.mode !== 'test') return;
    
    const obj = STATE.testObj;
    // FIX #1: Updated icons to match plan exactly. 
    // 0: Nail, 1: Paperclip, 2: Coin, 3: Pencil, 4: Plastic Spoon, 5: Eraser
    const icons = ['📌', '📎', '🪙', '✏️', '🥄', '🧽'];
    
    ctx.font = "40px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    
    let dx = 0, dy = 0;
    if (obj.stuck) {
        const ma = STATE.magnetA;
        
        // Find closest pole to snap to
        const nDist = Math.hypot(obj.x - (ma.flipped ? ma.x : ma.x + CONFIG.magnetWidth));
        const sDist = Math.hypot(obj.x - (ma.flipped ? ma.x + CONFIG.magnetWidth : ma.x));
        
        if (nDist < sDist) {
            dx = CONFIG.magnetWidth/2 + 10; 
        } else {
            dx = -(CONFIG.magnetWidth/2 + 10); 
        }
    }

    ctx.fillText(icons[obj.typeIndex], obj.x + 25 + dx, obj.y + 25 + dy);
}

function drawGrid() {
    ctx.strokeStyle = CONFIG.colors.grid;
    ctx.lineWidth = 1;
    const step = 40;
    
    ctx.beginPath();
    for(let x=0; x<width; x+=step) { ctx.moveTo(x,0); ctx.lineTo(x,height); }
    for(let y=0; y<height; y+=step) { ctx.moveTo(0,y); ctx.lineTo(width,y); }
    ctx.stroke();
}

function loop() {
    // Clear with dark background
    ctx.fillStyle = '#0f172a'; 
    ctx.fillRect(0, 0, width, height);
    
    drawGrid();
    updatePhysics();
    drawFieldLines();
    drawObject();
    drawMagnet(STATE.magnetA);
    drawMagnet(STATE.magnetB);

    requestAnimationFrame(loop);
}

// --- Interaction Handlers ---

function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

function isHitMagnet(mx, my, m) {
    return mx >= m.x && mx <= m.x + CONFIG.magnetWidth &&
           my >= m.y && my <= m.y + CONFIG.magnetHeight;
}

canvas.addEventListener('mousedown', (e) => {
    const pos = getMousePos(e);
    
    if (STATE.mode === 'two-magnets') {
        // FIX #3: Allow dragging either magnet. 
        // In a real app, we might check z-index or selection state, but here we allow both for better UX.
        if (isHitMagnet(pos.x, pos.y, STATE.magnetA) || isHitMagnet(pos.x, pos.y, STATE.magnetB)) {
            STATE.dragging = true;
            // Determine which magnet was clicked to set drag offset correctly
            const target = isHitMagnet(pos.x, pos.y, STATE.magnetA) ? STATE.magnetA : STATE.magnetB;
            STATE.dragOffset.x = pos.x - target.x;
            STATE.dragOffset.y = pos.y - target.y;
            canvas.style.cursor = 'grabbing';
        }
    } else {
        if (isHitMagnet(pos.x, pos.y, STATE.magnetA)) {
            STATE.dragging = true;
            STATE.dragOffset.x = pos.x - STATE.magnetA.x;
            STATE.dragOffset.y = pos.y - STATE.magnetA.y;
        }
    }
});

canvas.addEventListener('mousemove', (e) => {
    const pos = getMousePos(e);
    
    if (STATE.dragging) {
        // FIX #3: Update the correct magnet based on which one was clicked. 
        // For simplicity in this version, we'll update Magnet B if it's close to cursor, else A.
        // Or better: track 'activeMagnet' state. Let's just update both if they are close? No, that's weird.
        // Let's assume the user is dragging Magnet B (the "probe") in Two Magnets mode for simplicity, 
        // OR we can check which one was clicked last.
        
        // Simple approach: If in two-magnets mode and cursor is closer to B, drag B. Else drag A.
        if (STATE.mode === 'two-magnets') {
            const distA = Math.hypot(pos.x - (STATE.magnetA.x + CONFIG.magnetWidth/2), pos.y - STATE.magnetA.y);
            const distB = Math.hypot(pos.x - (STATE.magnetB.x + CONFIG.magnetWidth/2), pos.y - STATE.magnetB.y);
            
            if (distB < distA) {
                STATE.magnetB.x = pos.x - STATE.dragOffset.x;
                STATE.magnetB.y = pos.y - STATE.dragOffset.y;
            } else {
                STATE.magnetA.x = pos.x - STATE.dragOffset.x;
                STATE.magnetA.y = pos.y - STATE.dragOffset.y;
            }
        } else {
            STATE.magnetA.x = pos.x - STATE.dragOffset.x;
            STATE.magnetA.y = pos.y - STATE.dragOffset.y;
        }
        
        STATE.magnetA.x = Math.max(0, Math.min(width - CONFIG.magnetWidth, STATE.magnetA.x));
        STATE.magnetA.y = Math.max(0, Math.min(height - CONFIG.magnetHeight, STATE.magnetA.y));
    } else {
        if (STATE.mode === 'two-magnets' && (isHitMagnet(pos.x, pos.y, STATE.magnetA) || isHitMagnet(pos.x, pos.y, STATE.magnetB))) {
            canvas.style.cursor = 'grab';
        } else {
            canvas.style.cursor = 'default';
        }
    }
});

window.addEventListener('mouseup', () => {
    STATE.dragging = false;
    canvas.style.cursor = 'default';
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
    const touch = e.touches[0];
    const mouseEvent = new MouseEvent('mousedown', { clientX: touch.clientX, clientY: touch.clientY });
    canvas.dispatchEvent(mouseEvent);
}, {passive: false});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault(); 
    const touch = e.touches[0];
    const mouseEvent = new MouseEvent('mousemove', { clientX: touch.clientX, clientY: touch.clientY });
    canvas.dispatchEvent(mouseEvent);
}, {passive: false});

canvas.addEventListener('touchend', () => {
    window.dispatchEvent(new MouseEvent('mouseup'));
});


// --- UI Logic ---

function setMode(mode) {
    STATE.mode = mode;
    
    document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
    if (mode === 'test') document.querySelector('.pill-btn:first-child').classList.add('active');
    else document.querySelector('.pill-btn:last-child').classList.add('active');

    STATE.magnetA.x = width / 2 - CONFIG.magnetWidth / 2;
    STATE.magnetA.y = height / 2 - CONFIG.magnetHeight / 2;
    
    if (mode === 'two-magnets') {
        STATE.magnetB.x = width / 2 + 100;
        STATE.magnetB.y = height / 2 - CONFIG.magnetHeight / 2;
        
        // FIX #5: Hide tray with fade-out effect
        const tray = document.getElementById('object-tray');
        tray.classList.remove('visible');
        setTimeout(() => { tray.style.display = 'none'; }, 500);
    } else {
        const tray = document.getElementById('object-tray');
        tray.style.display = 'flex';
        // FIX #5: Trigger reflow then add visible class for fade-in animation
        void tray.offsetWidth; 
        tray.classList.add('visible');
        
        selectObject(STATE.testObj.typeIndex); 
    }
}

function flipPolarity() {
    // FIX #3: Flip the polarity of BOTH magnets to ensure interaction changes regardless of which is dragged.
    STATE.magnetA.flipped = !STATE.magnetA.flipped;
    STATE.magnetB.flipped = !STATE.magnetB.flipped;
    
    const svgIcon = document.querySelector('#flip-btn svg');
    if (svgIcon) {
        svgIcon.style.transition = 'none';
        svgIcon.style.transform = 'rotate(0deg)';
        
        // Force Reflow
        void svgIcon.offsetWidth; 
        
        svgIcon.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
        svgIcon.style.transform = 'rotate(360deg)';
        
        // Reset only after animation completes
        setTimeout(() => {
            svgIcon.style.transition = 'none';
            svgIcon.style.transform = 'rotate(0deg)';
        }, 450);
    }

    if (STATE.mode === 'two-magnets') {
        const rightA = STATE.magnetA.flipped ? 'S' : 'N';
        const leftB = STATE.magnetB.flipped ? 'N' : 'S';
        if (rightA !== leftB) showFeedback("Attract! 🧲");
        else showFeedback("Repel! ⚡");
    }
}

function toggleFieldLines() {
    STATE.showFieldLines = !STATE.showFieldLines;
    
    const btn = document.getElementById('field-btn');
    if (STATE.showFieldLines) {
        btn.style.color = 'var(--text-primary)';
        btn.style.borderColor = 'var(--border)';
    } else {
        // FIX #4: Visual indicator that field lines are off
        btn.style.color = 'var(--accent-cyan)';
        btn.style.borderColor = 'var(--accent-cyan)';
    }
}

function selectObject(index) {
    STATE.testObj.typeIndex = index;
    
    const items = document.querySelectorAll('.tray-item');
    items.forEach((item, i) => {
        if (i === index) item.classList.add('selected');
        else item.classList.remove('selected');
    });

    // FIX #1: Correct magnetic classification for educational accuracy.
    // Nail (Iron), Paperclip (Steel/Metal), Coin (Metal), Pencil (Wood/Graphite - No), Plastic Spoon (Plastic - No), Eraser (Rubber - No)
    const magneticObjects = [true, true, true, false, false, false]; 
    
    STATE.testObj.isMagnetic = magneticObjects[index];
    
    // Reset position to tray area (right side)
    STATE.testObj.stuck = false;
    STATE.testObj.x = width / 2 + 150;
    STATE.testObj.y = height / 2;
    STATE.testObj.vx = 0;
    STATE.testObj.vy = 0;

    if (!STATE.testObj.isMagnetic) {
        showFeedback("Not Magnetic 🚫");
    } else {
        setTimeout(() => showFeedback("Magnetic! ✨"), 500);
    }
}

function showFeedback(text) {
    const toast = document.getElementById('feedback-toast');
    toast.textContent = text;
    toast.classList.add('visible');
    
    clearTimeout(toast.timeout);
    toast.timeout = setTimeout(() => {
        toast.classList.remove('visible');
    }, 2000);
}

// Start loop
loop();

</script>
